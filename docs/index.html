<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorecast · анализ свежих игр Metacritic</title>
<meta name="description" content="Прототип сервиса: свежие игры Metacritic, резюме отзывов критиков и игроков, похожие игры, карта, чат с базой и мониторинг конвейера.">
<meta name="theme-color" content="#07090d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --bg2:#0c1017; --panel:#10151e; --panel2:#151b26; --line:#1f2733; --line2:#2a3443;
  --text:#e8edf4; --muted:#8a96a8; --dim:#5b6676;
  --critic:#38d9f5; --player:#ff6b8b; --acid:#c8ff3d; --warn:#ffb547;
  --good:#3ddc84; --mid:#ffc93d; --bad:#ff5a5a;
  --r:14px; --r2:20px;
  --f-display:"Unbounded", "Arial Black", sans-serif;
  --f-body:"Onest", "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:clip}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg,video,iframe,canvas{max-width:100%}
h1,h2,h3,h4,b,.ctitle,.tagline,.ins b,.ins span,.ans b,.ans span,.sim li,.pc li,.verdict,.desc,.facts dd{overflow-wrap:anywhere}
.lhead>*,.toolbar>*,.gcard,.gbody,.ins>div,.bigsc>div,.sumcol,.mhead>*,.mctl>*,.sim,.mcard,.stage-in>div,.dinfo>*,.msg{min-width:0}
.ptable table{table-layout:fixed}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(56,217,245,.10), transparent 60%),
    radial-gradient(700px 500px at -10% 30%, rgba(255,107,139,.07), transparent 60%),
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px) 0 0/100% 4px;}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 28px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(7,9,13,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap}
.logo-mark{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 210deg,var(--critic),var(--acid),var(--player),var(--critic));position:relative}
.logo-mark::after{content:"";position:absolute;inset:6px;border-radius:4px;background:var(--bg)}
.logo small{font:500 11px/1 var(--f-mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;transition:.2s}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.on{color:var(--bg);background:var(--acid)}
.nav svg{width:17px;height:17px;flex:none}
.nav .pulse{width:7px;height:7px;border-radius:50%;background:var(--acid);box-shadow:0 0 0 0 rgba(200,255,61,.6);animation:pulse 1.6s infinite}
.nav a.on .pulse{background:var(--bg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,255,61,.55)}70%{box-shadow:0 0 0 8px rgba(200,255,61,0)}100%{box-shadow:0 0 0 0 rgba(200,255,61,0)}}

main{position:relative;z-index:1;padding:28px 0 80px}
.page{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.kicker{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.fresh{display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1.3 var(--f-mono);color:var(--muted)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);flex:none}
.muted{color:var(--muted)} .dim{color:var(--dim)}

/* ---------- scores ---------- */
.s-good{--sc:var(--good)} .s-mid{--sc:var(--mid)} .s-bad{--sc:var(--bad)} .s-none{--sc:var(--dim)}
.ms{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border-radius:10px;background:var(--sc);color:#06120b;font:800 18px/1 var(--f-display)}
.ms.s-none,.us.s-none{background:transparent;border:1px dashed var(--line2);color:var(--muted);font:600 10.5px/1.15 var(--f-body);text-align:center;letter-spacing:0;width:auto;min-width:58px}
.us{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border-radius:50%;border:3px solid var(--sc);color:var(--text);font:800 15px/1 var(--f-display)}
.us.s-none{border-radius:10px}
.sc-txt{font-family:var(--f-mono);font-weight:600;color:var(--sc)}

/* ---------- covers (game-styled placeholders, no copied art) ---------- */
.cover{position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 78% 18%, color-mix(in srgb,var(--c3) 70%, transparent), transparent 52%),
             linear-gradient(145deg,var(--c1) 10%,var(--c2) 65%,color-mix(in srgb,var(--c3) 60%, var(--c2)));}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.9}
.cover::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,transparent 35%,rgba(5,7,10,.78))}
.pat-stripes::before{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 13px)}
.pat-grid::before{background:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 0 0/22px 22px}
.pat-dots::before{background:radial-gradient(rgba(255,255,255,.16) 1.3px,transparent 1.8px) 0 0/13px 13px}
.pat-rays::before{background:repeating-conic-gradient(from 0deg at 82% 12%,rgba(255,255,255,.08) 0 5deg,transparent 5deg 15deg)}
.pat-waves::before{background:repeating-radial-gradient(circle at 0 110%,rgba(255,255,255,.08) 0 2px,transparent 2px 15px)}
.pat-pixels::before{background:conic-gradient(rgba(255,255,255,.07) 25%,transparent 0 50%,rgba(255,255,255,.07) 0 75%,transparent 0) 0 0/16px 16px}
.pat-hex::before{background:repeating-linear-gradient(60deg,rgba(255,255,255,.06) 0 1.5px,transparent 1.5px 16px),repeating-linear-gradient(-60deg,rgba(255,255,255,.06) 0 1.5px,transparent 1.5px 16px)}
.pat-rings::before{background:repeating-radial-gradient(circle at 72% 30%,rgba(255,255,255,.09) 0 1.5px,transparent 1.5px 17px)}
.cover .mono-bg{position:absolute;right:-6%;top:-14%;font:800 clamp(80px,13vw,170px)/1 var(--f-display);color:rgba(255,255,255,.07);letter-spacing:-.06em;z-index:0;pointer-events:none}
.cover .ctitle{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;font:800 17px/1.08 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.5)}

/* ---------- list ---------- */
.lhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px;flex-wrap:wrap}
.lhead h1{font-size:clamp(28px,3.6vw,44px);line-height:1.02}
.lhead h1 em{font-style:normal;color:var(--acid)}
.lhead p{margin:10px 0 0}
.insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.ins{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.ins .ico{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);font:700 15px/1 var(--f-mono)}
.ins b{display:block;font-weight:600;font-size:14px;margin-bottom:2px}
.ins span{color:var(--muted);font-size:13px}
.ins a{color:var(--acid)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px;transition:border-color .2s}
.search:focus-within{border-color:var(--acid)}
.search input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0}
.search svg{width:18px;height:18px;color:var(--dim);flex:none}
.select{position:relative}
.select select{appearance:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:46px;padding:0 40px 0 14px;font-weight:600;cursor:pointer}
.select::after{content:"";position:absolute;right:16px;top:19px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.chip i{font-style:normal;font:500 11px/1 var(--f-mono);color:var(--dim)}
.chip:hover{color:var(--text);border-color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.on i{color:#556}
.count-line{font:500 12px/1 var(--f-mono);color:var(--dim);margin:-8px 0 16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(285px,100%),1fr));gap:18px}
.gcard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;animation:rise .5s both;animation-delay:calc(var(--i,0)*35ms)}
.gcard:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 40px -18px rgba(0,0,0,.8),0 0 0 1px color-mix(in srgb,var(--c3) 35%,transparent)}
.gcard .cover{aspect-ratio:16/9}
.gcard .scorebox{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:6px}
.gcard .scorebox .ms,.gcard .scorebox .us{height:38px;min-width:38px;font-size:15px}
.gcard .scorebox .us{background:rgba(5,7,10,.55);backdrop-filter:blur(4px)}
.gcard .scorebox .s-none{background:rgba(5,7,10,.55);backdrop-filter:blur(4px);font-size:10px;min-width:54px}
.gcard .newtag{position:absolute;top:14px;right:12px;z-index:2;font:600 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:rgba(5,7,10,.6);color:var(--acid)}
.gbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.gbody .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.gbody .meta span{min-width:0;overflow-wrap:anywhere}
.gbody .meta span+span::before{content:"·";margin-right:10px;color:var(--dim)}
.gbody .tagline{font-size:13.5px;color:var(--text);opacity:.85;margin:0}
.plats{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font:600 11.5px/1 var(--f-mono);color:var(--muted)}
.pchip b{font-weight:600}
.pchip .sep{width:1px;height:12px;background:var(--line2)}
.flag{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1.2 var(--f-mono);color:var(--warn)}
.flag::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--warn);transform:rotate(45deg)}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r2)}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:16px}
.back:hover{color:var(--text)}
.dhero{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.dhero-bg{position:absolute;inset:0;opacity:.55}
.dhero-bg::after{background:linear-gradient(90deg,rgba(7,9,13,.92) 30%,rgba(7,9,13,.55))}
.dhero-in{position:relative;z-index:2;display:grid;grid-template-columns:250px minmax(0,1fr) 360px;gap:32px;padding:32px}
.dcover{aspect-ratio:3/4;border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.08)}
.dcover .ctitle{font-size:22px}
.dinfo{min-width:0;display:flex;flex-direction:column;gap:12px}
.dinfo h1{font-size:clamp(26px,3.2vw,42px);line-height:1.04}
.dinfo .tl{font-size:16px;color:var(--text);opacity:.85;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 12px/1 var(--f-body);padding:6px 9px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#c9d2de}
.tag.g{color:var(--acid);border-color:color-mix(in srgb,var(--acid) 30%,transparent)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px;margin:4px 0 0}
.facts dt{color:var(--dim)} .facts dd{margin:0}
.scoreboard{display:flex;flex-direction:column;gap:12px}
.bigscores{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.bigsc{background:rgba(5,7,10,.55);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(6px)}
.bigsc .ms,.bigsc .us{height:56px;min-width:56px;font-size:22px}
.bigsc .ms.s-none,.bigsc .us.s-none{font-size:11px;min-width:64px}
.bigsc div>b{display:block;font-size:13px}
.bigsc div>span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.ptable{background:rgba(5,7,10,.55);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(6px)}
.ptable table{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{font:600 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.ptable td{padding:9px 12px;border-bottom:1px solid var(--line)}
.ptable tr:last-child td{border-bottom:0}
.ptable td small{color:var(--dim);font-family:var(--f-mono);font-size:11px;margin-left:4px}
.ptable .na{color:var(--dim);font-size:12px}

.subnav{position:sticky;top:64px;z-index:20;display:flex;gap:4px;padding:10px 0;margin:8px 0 6px;background:linear-gradient(var(--bg) 70%,transparent);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{padding:8px 13px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap}
.subnav button:hover{color:var(--text);background:var(--panel)}
.sec{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:26px;scroll-margin-top:120px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-size:21px}
.sec-h .note{font:500 12px/1.3 var(--f-mono);color:var(--dim)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px}
.desc{margin:0;color:#cfd7e2;font-size:15.5px;line-height:1.65}
.video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#000}
.video .cover{position:absolute;inset:0}
.video .cover::after{background:rgba(5,7,10,.55)}
.video button.play{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.play-ico{width:68px;height:68px;border-radius:50%;background:var(--acid);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(200,255,61,.15);transition:transform .2s}
.video button.play:hover .play-ico{transform:scale(1.08)}
.play-ico svg{width:24px;height:24px;margin-left:4px;color:var(--bg)}
.video .vt{font-weight:600;font-size:14px;max-width:420px;text-shadow:0 2px 10px #000}
.video .vd{font:500 12px/1 var(--f-mono);color:#c7d0dc}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.novideo{display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px;z-index:3;position:absolute;inset:0}

/* radar */
.vs{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:30px;align-items:center}
.radar{width:100%;height:auto;display:block;overflow:visible}
.radar .ring{fill:none;stroke:var(--line2);stroke-width:1}
.radar .axis{stroke:var(--line2);stroke-width:1}
.radar .lbl{font:600 12.5px var(--f-body);fill:var(--muted);cursor:pointer}
.radar .lbl.na{fill:var(--dim)}
.radar .lbl.hot{fill:var(--text)}
.radar .poly-c{fill:rgba(56,217,245,.16);stroke:var(--critic);stroke-width:2.2}
.radar .poly-p{fill:rgba(255,107,139,.14);stroke:var(--player);stroke-width:2.2}
.radar .dot{stroke:var(--bg);stroke-width:2;cursor:pointer;transition:r .15s}
.radar .dot:hover,.radar .dot.hot{r:7}
.radar .hit{fill:transparent;cursor:pointer}
.radar .poly-c,.radar .poly-p{transform-origin:center;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.radar .poly-p{animation-delay:.12s}
@keyframes grow{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px}
.divbadge{display:inline-flex;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:12px;font-weight:600;font-size:13.5px;border:1px solid}
.divbadge .lvl{font:700 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:6px;color:var(--bg)}
.div-lo{border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)} .div-lo .lvl{background:var(--good)}
.div-md{border-color:color-mix(in srgb,var(--mid) 40%,transparent);background:color-mix(in srgb,var(--mid) 8%,transparent)} .div-md .lvl{background:var(--mid)}
.div-hi{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)} .div-hi .lvl{background:var(--bad)}
.div-na{border-color:var(--line2);color:var(--muted)} .div-na .lvl{background:var(--dim)}
.asp{display:flex;flex-direction:column;gap:4px;margin-top:16px}
.arow{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
.arow:hover,.arow.hot{background:var(--panel2)}
.arow .an{font-weight:600;font-size:13.5px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{height:6px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;transform-origin:left;animation:fill .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{transform:scaleX(0)}}
.bar.c i{background:var(--critic)} .bar.p i{background:var(--player)}
.bar.na{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.arow .ad{font:600 12px/1 var(--f-mono);text-align:right}
.ad.up{color:var(--player)} .ad.down{color:var(--critic)} .ad.eq{color:var(--dim)}
.hint{font-size:12.5px;color:var(--dim);margin-top:10px}

.tip{position:fixed;z-index:200;max-width:340px;background:#0b0f16;border:1px solid var(--line2);border-radius:14px;padding:14px;box-shadow:0 24px 50px -10px rgba(0,0,0,.9);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:13px}
.tip.on{opacity:1;transform:none}
.tip h4{margin:0 0 10px;font:700 14px/1 var(--f-display)}
.tq{border-left:3px solid;padding:2px 0 2px 10px;margin-top:10px}
.tq.c{border-color:var(--critic)} .tq.p{border-color:var(--player)}
.tq .who{font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.tq.c .who{color:var(--critic)} .tq.p .who{color:var(--player)}
.tq q{display:block;color:#d7dee8;font-style:italic;quotes:"«" "»"}
.tq .src{display:block;color:var(--dim);font-size:11.5px;margin-top:4px}
.tq .inf{color:var(--dim);font-size:12px}

/* summary */
.sumgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.sumcol{border-radius:16px;padding:20px;background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--sc2)}
.sumcol.c{--sc2:var(--critic)} .sumcol.p{--sc2:var(--player)}
.sumcol header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sumcol h3{font-size:16px;color:var(--sc2)}
.analyzed{font:500 11.5px/1.3 var(--f-mono);color:var(--dim)}
.verdict{font-size:15px;line-height:1.55;margin:0 0 14px;color:#dbe2ec}
.pc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pc li{border-radius:10px;padding:9px 10px 9px 34px;position:relative;font-size:14px;cursor:pointer;transition:background .15s}
.pc li:hover{background:var(--panel2)}
.pc li::before{position:absolute;left:10px;top:9px;width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font:700 12px/16px var(--f-mono);text-align:center}
.pc.plus li::before{content:"+";background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pc.minus li::before{content:"−";background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pc li q{display:none;margin-top:6px;font-size:13px;font-style:italic;color:var(--muted);quotes:"«" "»"}
.pc li.open q{display:block}
.pc li q::after{content:close-quote}
.pc li .qsrc{display:none;font:500 11px/1.3 var(--f-mono);color:var(--dim);margin-top:3px}
.pc li.open .qsrc{display:block}
.pc-h{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.nodata{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line2);border-radius:12px}

/* letsplay */
.lp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px}
.demo-note{font:500 11px/1 var(--f-mono);color:var(--dim);letter-spacing:.04em;margin-left:10px;vertical-align:middle;white-space:nowrap}
.lpv{border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#000}
.lpv .cover{aspect-ratio:16/9}
.lpv .cover::after{background:linear-gradient(180deg,rgba(5,7,10,.25),rgba(5,7,10,.75))}
.lpv .lptitle{position:absolute;left:16px;right:16px;top:14px;z-index:2;font-weight:600;font-size:14px;text-shadow:0 2px 8px #000}
.lpv .lpnow{position:absolute;left:16px;bottom:14px;z-index:2;font:600 13px/1 var(--f-mono);background:rgba(5,7,10,.7);padding:6px 8px;border-radius:7px}
.lpv .play-ico{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:58px;height:58px}
.tl-bar{position:relative;height:34px;background:#0a0d12;border-top:1px solid var(--line)}
.tl-track{position:absolute;left:14px;right:14px;top:15px;height:4px;border-radius:3px;background:var(--line2)}
.tl-prog{position:absolute;left:0;top:0;bottom:0;background:var(--acid);border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.tl-mk{position:absolute;top:-5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--panel2);border:2px solid var(--acid);cursor:pointer;transition:transform .15s}
.tl-mk:hover,.tl-mk.on{transform:scale(1.25);background:var(--acid)}
.lp-sum{margin:0 0 14px;color:#dbe2ec;line-height:1.6}
.moments{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.moments button{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;padding:9px 10px;border-radius:10px;font-size:14px;transition:background .15s}
.moments button:hover,.moments button.on{background:var(--panel2)}
.moments time{font:600 12.5px/1 var(--f-mono);color:var(--acid);min-width:56px}
.lp-link{font:500 12px/1.4 var(--f-mono);color:var(--dim);margin-top:10px;overflow-wrap:anywhere}

/* similar */
.simgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sim{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.sim:hover{transform:translateY(-3px);border-color:var(--line2)}
.sim .cover{aspect-ratio:16/8}
.sim .cover .ctitle{font-size:14px}
.sim .pct{position:absolute;top:10px;right:10px;z-index:2;font:700 12px/1 var(--f-mono);padding:5px 7px;border-radius:7px;background:rgba(5,7,10,.65);color:var(--acid)}
.sim ul{margin:0;padding:12px 14px 14px;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#c9d2de}
.sim li{display:flex;gap:8px}
.sim li::before{content:"";flex:none;width:5px;height:5px;margin-top:8px;border-radius:50%;background:var(--acid)}

/* ---------- map ---------- */
.maplay{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;position:relative}
.mapsvg{display:block;width:100%;height:auto;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 70%)}
.mapsvg .gridl{stroke:rgba(255,255,255,.035)}
.mapsvg .blob{transition:opacity .25s}
.mapsvg .clabel{font:700 13px var(--f-display);letter-spacing:.02em;text-transform:uppercase;pointer-events:none}
.mapsvg .pt{cursor:pointer;transition:opacity .2s}
.mapsvg .pt circle.core{stroke:var(--bg);stroke-width:2.5;transition:r .15s}
.mapsvg .pt:hover circle.core{r:15}
.mapsvg .pt text{font:600 12px var(--f-body);fill:#cdd5e0;pointer-events:none}
.mlist{display:flex;flex-direction:column;gap:12px}
.mlist .ans{margin-top:8px}
.mapsvg .link{stroke:var(--acid);stroke-width:1.5;stroke-dasharray:4 4;opacity:0;transition:opacity .2s}
.mapsvg .link.on{opacity:.85}
.mapsvg.dim .pt:not(.on){opacity:.22}
.mapside{display:flex;flex-direction:column;gap:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mcard h3{font-size:14px;margin-bottom:10px}
.clist{display:flex;flex-direction:column;gap:4px}
.clist button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left;font-weight:600;font-size:13.5px}
.clist button:hover,.clist button.on{background:var(--panel2)}
.clist i{width:10px;height:10px;border-radius:50%;flex:none}
.clist small{margin-left:auto;font:500 11px/1 var(--f-mono);color:var(--dim)}
.mapnote{font-size:13px;color:var(--muted);line-height:1.55}

/* ---------- chat ---------- */
.chat{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.chatbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;min-height:620px}
.msgs{flex:1;padding:22px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:88%;animation:rise .3s both}
.msg.u{align-self:flex-end;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:16px 16px 4px 16px;font-weight:500}
.msg.a{align-self:flex-start;display:flex;gap:12px}
.avatar{flex:none;width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,var(--critic),var(--acid),var(--player),var(--critic));position:relative}
.avatar::after{content:"";position:absolute;inset:5px;border-radius:6px;background:var(--panel)}
.abody{background:var(--bg2);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px;min-width:0}
.abody p{margin:0 0 10px}
.abody p:last-child{margin-bottom:0}
.steps{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line2)}
.step{font:500 12px/1.4 var(--f-mono);color:var(--dim);display:flex;gap:8px;animation:rise .25s both}
.step b{color:var(--critic);font-weight:600;flex:none}
.step code{color:#aeb9c8;overflow-wrap:anywhere}
.ans-list{display:flex;flex-direction:column;gap:8px;margin:10px 0 2px}
.ans{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);transition:border-color .15s}
.ans:hover{border-color:var(--acid)}
.ans .cover{width:64px;height:44px;border-radius:8px;flex:none}
.ans .cover::after{background:none}
.ans div>b{display:block;font-size:14px}
.ans div>span{font-size:12.5px;color:var(--muted)}
.ans .ms{margin-left:auto;height:34px;min-width:34px;font-size:13px;flex:none}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.composer input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;height:48px;padding:0 16px;outline:0;min-width:0}
.composer input:focus{border-color:var(--acid)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 20px;border-radius:12px;background:var(--acid);color:var(--bg);font-weight:700;transition:transform .15s,filter .15s,opacity .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{text-align:left;padding:11px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px;transition:border-color .15s}
.sugg button:hover{border-color:var(--acid)}

/* ---------- monitor ---------- */
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.mhead h1{font-size:clamp(26px,3vw,38px)}
.mctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.nextrun{font:500 12.5px/1.4 var(--f-mono);color:var(--muted);text-align:right}
.nextrun b{color:var(--text);font-size:15px}
.state-pill{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--f-mono);padding:8px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.state-pill.run{color:var(--acid);border-color:color-mix(in srgb,var(--acid) 40%,transparent)}
.state-pill i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.state-pill.run i{background:var(--acid);animation:pulse 1.4s infinite}
.pipe{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:22px;margin-bottom:18px}
.pipe-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.batch{font:500 12.5px/1.4 var(--f-mono);color:var(--muted)}
.batch b{color:var(--text)}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative}
.stage{position:relative;padding:0 8px}
.stage-in{position:relative;z-index:1;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;transition:border-color .3s,box-shadow .3s,background .3s}
.stage.active .stage-in{border-color:var(--acid);box-shadow:0 0 0 4px rgba(200,255,61,.08),0 0 30px -6px rgba(200,255,61,.35);background:color-mix(in srgb,var(--acid) 4%,var(--bg2))}
.stage.done .stage-in{border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.stage .num{font:600 11px/1 var(--f-mono);color:var(--dim);letter-spacing:.1em}
.stage h3{font-size:15px;margin:8px 0 4px}
.stage p{margin:0;font-size:12px;color:var(--muted);min-height:32px}
.stage .cnt{font:700 22px/1 var(--f-display);margin-top:12px}
.stage .cnt small{font:500 12px var(--f-mono);color:var(--dim)}
.stage .sbar{height:4px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.stage .sbar i{display:block;height:100%;width:0;background:var(--acid);transition:width .3s}
.stage .cur{font:500 11px/1.3 var(--f-mono);color:var(--acid);margin-top:8px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage:not(:last-child)::after{content:"";position:absolute;z-index:0;top:50%;right:-8px;width:16px;height:2px;background:var(--line2)}
.stage.flow:not(:last-child)::after{background:linear-gradient(90deg,var(--acid) 50%,transparent 50%) 0 0/8px 2px;animation:flow .5s linear infinite}
@keyframes flow{to{background-position:8px 0}}
.counters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.ctr{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ctr span{font-size:12px;color:var(--muted)}
.ctr b{display:block;font:700 22px/1.2 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.ctr b.acid{color:var(--acid)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:20px;min-width:0}
.panel h2{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 small{font:500 11.5px var(--f-mono);color:var(--dim);letter-spacing:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:600 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:0 8px 10px}
.tbl td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .mono{font-size:12px}
.wst{display:inline-flex;align-items:center;gap:7px;font:600 11.5px/1 var(--f-mono)}
.wst i{width:8px;height:8px;border-radius:50%}
.wst.busy{color:var(--acid)} .wst.busy i{background:var(--acid);box-shadow:0 0 8px var(--acid)}
.wst.idle{color:var(--muted)} .wst.idle i{background:var(--dim)}
.wst.retry{color:var(--warn)} .wst.retry i{background:var(--warn)}
.job{color:var(--muted);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{height:330px;overflow:auto;font:12px/1.65 var(--f-mono);background:#06080b;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.log div{white-space:pre-wrap;word-break:break-word}
.log .t{color:var(--dim)} .log .w{color:#8ab4ff} .log .ok{color:var(--good)} .log .wr{color:var(--warn)} .log .inf{color:#b7c2d0}
.hist{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.hist div{flex:1;background:var(--line2);border-radius:4px 4px 0 0;position:relative;min-height:4px;transition:height .4s}
.hist div.cur{background:var(--acid)}
.hist div.err{background:linear-gradient(var(--warn) 0 6px,var(--line2) 6px)}
.hist-l{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:var(--dim);margin-top:6px}
.crawl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:13px}
.crawl dt{color:var(--dim)} .crawl dd{margin:0;font-family:var(--f-mono);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:300;background:#151b26;border:1px solid var(--warn);color:var(--text);padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:22px 0 34px;color:var(--dim);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .dhero-in{grid-template-columns:200px minmax(0,1fr)}
  .scoreboard{grid-column:1/-1}
  .simgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .counters{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:980px){
  .maplay,.chat{grid-template-columns:minmax(0,1fr)}
  .mgrid{grid-template-columns:minmax(0,1fr)}
  .stages{grid-template-columns:minmax(0,1fr);gap:10px}
  .stage{padding:0}
  .stage:not(:last-child)::after{top:auto;bottom:-10px;right:auto;left:28px;width:2px;height:10px}
  .stage.flow:not(:last-child)::after{background:var(--acid)}
  .stage-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:center}
  .stage p{min-height:0}
  .stage .cnt{margin:0;grid-row:1/3;grid-column:2;text-align:right}
  .stage .sbar,.stage .cur{grid-column:1/-1}
}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(7,9,13,.96)}
  .top .wrap{height:56px}
  .logo small{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:rgba(9,12,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:60}
  .nav a{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;flex:1;justify-content:center}
  .nav a.on{background:none;color:var(--acid)}
  .nav a.on .pulse{background:var(--acid)}
  .nav .pulse{position:absolute;margin:-20px 0 0 18px}
  .nav a{position:relative}
  main{padding:18px 0 100px}
  footer{padding-bottom:96px}
  .insights{grid-template-columns:minmax(0,1fr)}
  .search{flex:1 1 100%}
  .select{flex:1 1 100%}
  .select select{width:100%}
  .nav a{flex:1 1 0;min-width:0;font-size:10px;letter-spacing:-.01em;padding:7px 2px}
  .nav a svg{width:20px;height:20px}
  .tbl{table-layout:fixed}
  .bigsc{flex-direction:column;align-items:flex-start;gap:10px}
  .bigsc div>b{overflow-wrap:normal}
  .tbl .job{max-width:none}
  .tbl th:first-child{width:34%}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 0 18px;padding:0;scrollbar-width:none;overscroll-behavior-x:contain}
  .chips::-webkit-scrollbar{display:none}
  .grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .dhero-in{grid-template-columns:minmax(0,1fr);padding:18px;gap:18px}
  .dcover{aspect-ratio:16/9}
  .two,.vs,.sumgrid,.lp{grid-template-columns:minmax(0,1fr);gap:20px}
  .vs .radar{max-width:340px;margin:0 auto}
  .sec{padding:18px;border-radius:16px}
  .subnav{top:56px}
  .arow{grid-template-columns:92px minmax(0,1fr) 54px;padding:8px 6px}
  .simgrid{grid-template-columns:minmax(0,1fr)}
  .counters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl .hide-m{display:none}
  .chatbox{min-height:520px}
  .msgs{padding:14px}
  .msg{max-width:100%}
  .mhead{align-items:flex-start}
  .nextrun{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">

st. Delve into Dungeons. Explore Dungeons with your hero to gather materials and uncover treasure chests. Fight the monsters and ruffians lurking there in Clashes, battles where your team takes turns attacking the enemy. Fight in the Heroic Games. Eventually, it will be time for you to take part in the Heroic Games and face your competitors in battle. Some matches might involve unique rules or make use of terrain, so be prepared for anything.  [Nintendo]","genres":["Turn-Based Tactics"],"rating":"T","developer":["Nintendo"],"publisher":["Nintendo"],"metascore":89,"userscore":8.5,"criticSentiment":"Generally favorable","userSentiment":"Generally favorable","criticTotal":105,"userTotal":932,"analyzed":{"critic":36,"user":54},"platforms":[{"name":"Nintendo Switch 2","metascore":89,"criticReviews":109,"userscore":8.5,"userReviews":932}],"video":{"title":"Fire Emblem: Fortune’s Weave &#8211; Official Game Overview Trailer","duration":450,"embedUrl":"https://cdn.jwplayer.com/players/GoyqLLky.html"},"inNewReleases":false,"palette":["#14182e","#7a1f2b","#d9a441"],"pattern":"grid","tagline":"Четыре лорда, одна судьба и сотня часов тактики","tags":["tactics","turn-based","jrpg","rpg","fantasy","story-rich","single-player","anime"],"summary":{"critics":{"verdict":"Масштабная и щедрая тактическая RPG с, возможно, лучшими боями в серии. Критики хвалят сюжет четырёх героев, но ругают рутину и затянутость между сражениями.","likes":[{"text":"Пошаговые бои отличные, разнообразные и глубокие","quote":"The turn-based battles are excellent, varied, and mechanically deep, while the four main protagonists offer distinctly different stories and gameplay possibilities.","src":"Games.cz"},{"text":"Огромный объём контента на 150-200 часов","quote":"a staggering amount of content that could easily keep you occupied for 150 to 200 hours if you choose to fully immerse yourself in its world","src":"What's It Like?"},{"text":"Проработанные персонажи и увлекательный сюжет","quote":"The characters   return `<div class="cover pat-${g.pattern} ${extra}" style="--c1:${a};--c2:${b};--c3:${c}"><span class="mono-bg">${esc(mono)}</span>${withTitle ? `<span class="ctitle">${esc(g.title)}</span>` : ''}</div>`;
}

function aspectList(g) { return ASPECTS.map(([k, n]) => ({ k, n, ...(g.aspects[k] || {}) })); }
function divergence(g) {
  let best = null;
  for (const a of aspectList(g)) {
    if (a.critic == null || a.player == null) continue;
    const d = +(a.player - a.critic).toFixed(1);
    if (!best || Math.abs(d) > Math.abs(best.d)) best = { ...a, d };
  }
  return best;
}
const overallDelta = g => (g.metascore == null || g.userscore == null) ? null : +(g.userscore - g.metascore / 10).toFixed(1);
const divLevel = d => d == null ? ['div-na', 'нет данных'] : Math.abs(d) < 1 ? ['div-lo', 'согласие'] : Math.abs(d) < 2 ? ['div-md', 'заметное'] : ['div-hi', 'сильное'];

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }

function insights() {
  // averages skip games without scores: null is "нет оценки", not zero
  const per = ASPECTS.map(([k, n]) => {
    const both = G.map(g => g.aspects[k]).filter(a => a && a.critic != null && a.player != null);
    const d = both.length ? both.reduce((s, a) => s + a.player - a.critic, 0) / both.length : 0;
    return { k, n, d, cnt: both.length };
  }).filter(x => x.cnt >= 3);
  const worst = [...per].sort((a, b) => a.d - b.d)[0];
  const kind = [...per].sort((a, b) => b.d - a.d)[0];
  const rated = G.filter(g => overallDelta(g) != null);
  const spat = [...rated].sort((a, b) => Math.abs(overallDelta(b)) - Math.abs(overallDelta(a)))[0];
  const withU = G.filter(g => g.userscore != null);
  const avgU = withU.reduce((s, g) => s + g.userscore, 0) / withU.length;
  const withM = G.filter(g => g.metascore != null);
  const avgM = withM.reduce((s, g) => s + g.metascore, 0) / withM.length;
  return `
  <div class="insights">
    <div class="ins"><div class="ico" style="color:var(--player)">${worst.d > 0 ? '+' : ''}${worst.d.toFixed(1)}</div><div><b>Игроки строже критиков: ${worst.n.toLowerCase()}</b><span>Средняя разница оценок аспекта по ${worst.cnt} ${plural(worst.cnt,'игре','играм','играм')} с обеими оценками</span></div></div>
    <div class="ins"><div class="ico" style="color:var(--warn)">Δ</div><div><b>Главный спор: <a href="#/game/${spat.slug}">${esc(spat.title)}</a></b><span>Metascore ${spat.metascore} против Userscore ${spat.userscore.toFixed(1)}</span></div></div>
    <div class="ins"><div class="ico" style="color:var(--critic)">ø</div><div><b>Средние: Metascore ${avgM.toFixed(0)} · Userscore ${avgU.toFixed(1)}</b><span>Без игр с «нет оценки»: у ${G.length - withU.length} из ${G.length} игр Userscore пока не рассчитан</span></div></div>
  </div>`;
}

function sortGames(list, key) {
  const nl = (a, b, f) => { const x = f(a), y = f(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return y - x; };
  const by = {
    meta: (a, b) => nl(a, b, g => g.metascore) || nl(a, b, g => g.userscore),
    user: (a, b) => nl(a, b, g => g.userscore) || nl(a, b, g => g.metascore),
    date: (a, b) => b.releaseDate.localeCompare(a.releaseDate) || nl(a, b, g => g.metascore),
    div: (a, b) => nl(a, b, g => overallDelta(g) == null ? null : Math.abs(overallDelta(g))),
    title: (a, b) => a.title.localeCompare(b.title),
  }[key];
  return [...list].sort(by);
}

function drawGrid() {
  const q = LS.q.trim().toLowerCase();
  let list = G.filter(g => (!q || g.title.toLowerCase().includes(q)) && (!LS.plats.size || g.platforms.some(p => LS.plats.has(p.name))));
  list = sortGames(list, LS.sort);
  $('#cnt').textContent = `Показано ${list.length} из ${G.length}` + (LS.sort === 'user' || LS.sort === 'div' ? ' · игры без оценки в конце списка' : '');

function radarSVG(g) {
  const S = 380, C = S / 2, R = 128, N = ASPECTS.length;
  const pt = (i, v) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / N; return [C + Math.cos(ang) * R * v / 10, C + Math.sin(ang) * R * v / 10]; };
  const A = aspectList(g);
  let s = `<svg class="radar" viewBox="0 0 ${S} ${S}" role="img" aria-label="Радар аспектов: критики против игроков">`;
  [2, 4, 6, 8, 10].forEach(v => { s += `<polygon class="ring" points="${A.map((_, i) => pt(i, v).join(',')).join(' ')}"/>`; });
  A.forEach((a, i) => { const [x, y] = pt(i, 10); s += `<line class="axis" x1="${C}" y1="${C}" x2="${x}" y2="${y}"/>`; });
  const poly = (key, c) => { const P = A.map((a, i) => a[key] == null ? null : pt(i, a[key])).filter(Boolean); return P.length >= 3 ? `<polygon class="${c}" points="${P.map(p => p.join(',')).join(' ')}"/>` : ''; };
  s += poly('critic', 'poly-c') + poly('player', 'poly-p');
  A.forEach((a, i) => {
    const [lx, ly] = pt(i, 12.6);
    const anchor = Math.abs(lx - C) < 8 ? 'middle' : lx > C ? 'start' : 'end';
    const na = a.critic == null && a.player == null;
    s += `<text class="lbl ${na ? 'na' : ''}" data-asp="${a.k}" x="${lx}" y="${ly + 4}" text-anchor="${anchor}">${a.n}${na ? ' · н/д' : ''}</text>`;
    const [hx, hy] = pt(i, 10); s += `<circle class="hit" data-asp="${a.k}" cx="${hx}" cy="${hy}" r="22"/>`;
    if (a.critic != null) { const [x, y] = pt(i, a.critic); s += `<circle class="dot" data-asp="${a.k}" cx="${x}" cy="${y}" r="5" fill="var(--critic)"/>`; }
    if (a.player != null) { const [x, y] = pt(i, a.player); s += `<circle class="dot" data-asp="${a.k}" cx="${x}" cy="${y}" r="5" fill="var(--player)"/>`; }
  });
  return s + '</svg>';
}

function tipHTML(g, k) {
  const a = { ...(g.aspects[k] || {}) }; const name = ASPECTS.find(x => x[0] === k)[1];
  const block = (side, label, score, q) => `<div class="tq ${side}"><div class="who"><span>${label}</span><span>${score == null ? 'нет оценки' : score.toFixed(1) + ' / 10'}</span></div>${q ? `<q>${esc(q.q)}</q><span class="src">${esc(q.src)}</span>` : `<span class="inf">${score == null ? (k === 'multiplayer' ? 'Мультиплеера нет или о нём не пишут' : 'Недостаточно отзывов') : 'Вывод по общему тону отзывов, прямой цитаты нет'}</span>`}</div>`;
  return `<h4>${name}</h4>${block('c', 'Критики', a.critic, a.criticQuote)}${block('p', 'Игроки', a.player, a.playerQuote)}`;
}

function showTip(html, x, y) {
  const t = $('#tip'); t.innerHTML = html; t.classList.add('on');
  const w = t.offsetWidth, h = t.offsetHeight, vw = innerWidth, vh = innerHeight;
  let left = x + 16, top = y + 16;
  if (left + w > vw - 12) left = Math.max(12, x - w - 16);
  if (top + h > vh - 12) top = Math.max(12, vh - h - 12);
  if (vw < 600) { left = (vw - w) / 2; }
  t.style.left = left + 'px'; t.style.top = top + 'px';
}

/* ===================== CHAT ===================== */
const CHAT = { msgs: [] };
const SUGG = ['Что похоже на Phantom Blade Zero?', 'Где критики и игроки сильнее всего расходятся?', 'Лучшие игры на Nintendo Switch 2', 'Во что поиграть в кооперативе?', 'Какие игры ругают за оптимизацию?', 'Посоветуй сюжетную игру'];
const PLAT_RX = [[/switch\s*2|свитч\s*2/i, 'Nintendo Switch 2'], [/ps\s*5|playstation\s*5|плейстейшн/i, 'PlayStation 5'], [/xbox|иксбокс/i, 'Xbox Series X'], [/\bpc\b|\bпк\b|компьютер/i, 'PC'], [/switch|свитч/i, 'Nintendo Switch']];
const TAG_RX = [[/хоррор|ужас|страшн/i, 'horror'], [/гонк/i, 'racing'], [/jrpg|японск/i, 'jrpg'], [/ретро|классик/i, 'retro'], [/уютн|расслаб|спокойн/i, 'cozy'], [/платформер/i, 'platformer'], [/метроидвани/i, 'metroidvania'], [/выжив/i, 'survival'], [/тактик/i, 'tactics'], [/самол|авиа|лётч|летч/i, 'flight'], [/кооп|вдво[её]м|с друз|компани/i, 'co-op'], [/открыт\S* мир/i, 'open-world'], [/сюжет|истори/i, 'story-rich'], [/дет|семь|ребен|ребён/i, 'family'], [/динозавр/i, 'dinosaurs'], [/ролев|\brpg\b|рпг/i, 'rpg'], [/слэшер|экшен|сражен|бо[ий]/i, 'action'], [/квест|point/i, 'point-and-click']];
const ASP_RX = [[/оптимиз|производит|тормоз|лаг|баг|fps|фпс/i, 'performance'], [/графи|картинк|визуал/i, 'graphics'], [/цен|стоимост|деньг|стоит ли/i, 'price'], [/геймпле|игровой процесс/i, 'gameplay']];

function findGame(q) {
  const t = q.toLowerCase();
  let best = null;
  for (const g of G) {
    const main = g.title.toLowerCase().split(/[:\-–]/)[0].trim();
    if (t.includes(main) && (!best || main.length > best[1])) best = [g, main.length];
    else { const w = main.split(/\s+/).find(w => w.length >= 5 && !/^(remastered|collection|edition|deluxe)$/.test(w)); if (w && t.includes(w) && !best) best = [g, w.length]; }
  }
  return best && best[0];
}

function agent(q) {
  const steps = [], t = q.toLowerCase();
  let text = '', items = [];
  const g = findGame(q);
  const plat = PLAT_RX.find(([rx]) => rx.test(q));
  const tag = TAG_RX.find(([rx]) => rx.test(q));
  const asp = ASP_RX.find(([rx]) => rx.test(q));
  steps.push(['parse', `intent(${JSON.stringify(Object.fromEntries(Object.entries({ game: g && g.slug, platform: plat && plat[1], tag: tag && tag[1], aspect: asp && asp[1] }).filter(([, v]) => v)))})`]);
  if (g && /похож|вроде|типа|аналог|как в|наподоб/i.test(q)) {
    steps.push(['vector', `knn(game='${g.slug}', k=4) → pgvector cosine`]);
    items = g.similar.slice(0, 4).map(s => ({ g: BY[s.slug], why: simReasons(g, s).slice(0, 2).join(' · ') }));
    text = `Ближе всего к <b>${esc(g.title)}</b> по описанию, тегам и профилю оценок:`;
  } else if (/расход|спор|недооцен|переоцен|не соглас|критик\S* и игрок|игрок\S* и критик/i.test(q)) {
    steps.push(['sql', 'SELECT … ORDER BY abs(userscore - metascore/10) DESC NULLS LAST LIMIT 4']);
    const list = G.filter(x => overallDelta(x) != null).sort((a, b) => Math.abs(overallDelta(b)) - Math.abs(overallDelta(a))).slice(0, 4);
    items = list.map(x => { const dv = divergence(x); return { g: x, why: `Metascore ${x.metascore} vs Userscore ${x.userscore.toFixed(1)}${dv ? ` · сильнее всего: ${dv.n.toLowerCase()} (${dv.d > 0 ? '+' : ''}${dv.d.toFixed(1)})` : ''}` }; });
    text = `Сильнее всего мнения расходятся здесь. Игры без Userscore я не учитывал: у ${G.filter(x => x.userscore == null).length} игр он ещё не рассчитан.`;
  } else if (asp && /руга|плох|жалу|проблем|хуже|слаб/i.test(q)) {
    const [k, n] = ASPECTS.find(a => a[0] === asp[1]);
    steps.push(['sql', `SELECT … FROM aspects WHERE aspect='${k}' ORDER BY coalesce(player, critic) ASC LIMIT 4`]);
    const list = G.filter(x => x.aspects[k] && (x.aspects[k].player ?? x.aspects[k].critic) != null).sort((a, b) => (a.aspects[k].player ?? a.aspects[k].critic) - (b.aspects[k].player ?? b.aspects[k].critic)).slice(0, 4);
    items = list.map(x => { const a = x.aspects[k]; const q2 = a.playerQuote || a.criticQuote; return { g: x, why: `${n}: игроки ${a.player != null ? a.player.toFixed(1) : 'нет оценки'}, критики ${a.critic != null ? a.critic.toFixed(1) : 'нет оценки'}${q2 ? ` · «${q2.q.slice(0, 70)}${q2.q.length > 70 ? '…' : ''}»` : ''}` }; });
    text = `Чаще всего за аспект «${n.toLowerCase()}» достаётся этим играм (сначала смотрю на оценку игроков):`;
  } else if (g) {
    steps.push(['sql', `SELECT * FROM games WHERE slug='${g.slug}'`]);
    items = [{ g, why: g.summary.critics.verdict }];
    text = `Нашёл в базе. Metascore ${g.metascore ?? 'нет оценки'}, Userscore ${g.userscore != null ? g.userscore.toFixed(1) : 'нет оценки'}.${g.summary.players ? ' Игроки: ' + esc(g.summary.players.verdict) : ' Отзывов игроков пока мало.'}`;
  } else if (plat || tag || asp) {
    const useUser = /игрок|пользовател|юзер/i.test(q);
    const where = [plat && `platform='${plat[1]}'`, tag && `'${tag[1]}' = ANY(tags)`].filter(Boolean).join(' AND ') || 'TRUE';
    const k = asp ? asp[1] : null;
    steps.push(['sql', `SELECT … WHERE ${where} ORDER BY ${k ? `aspects.${k}` : useUser ? 'userscore' : 'metascore'} DESC NULLS LAST LIMIT 4`]);
    let list = G.filter(x => (!plat || x.platforms.some(p => p.name === plat[1])) && (!tag || x.tags.includes(tag[1])));
    const val = x => k ? (x.aspects[k] && (x.aspects[k].critic ?? x.aspects[k].player)) : useUser ? x.userscore : (plat ? x.platforms.find(p => p.name === plat[1]).metascore : x.metascore);
    list = list.filter(x => val(x) != null).sort((a, b) => val(b) - val(a)).slice(0, 4);
    items = list.map(x => ({ g: x, why: `${plat ? `${PLAT_SHORT[plat[1]]}: Metascore ${x.platforms.find(p => p.name === plat[1]).metascore ?? 'нет оценки'}` : `Metascore ${x.metascore ?? 'нет оценки'}`} · ${x.tagline}` }));
    text = list.length ? `Подобрал по ${[plat && 'платформе ' + plat[1], tag && 'тегу «' + (TAG_RU[tag[1]] || tag[1]) + '»', k && 'аспекту «' + ASPECTS.find(a => a[0] === k)[1].toLowerCase() + '»'].filter(Boolean).join(' и ')}, сортировка по ${k ? 'оценке аспекта' : useUser ? 'Userscore' : 'Metascore'}:` : 'В базе пока нет игр с оценками под такой запрос.';
  } else {
    steps.push(['vector', `semantic_search('${q.replace(/'/g, '')}', k=4)`]);
    const words = t.split(/[^a-zа-яё0-9]+/i).filter(w => w.length >= 4);
    const scored = G.map(x => { const hay = (x.title + ' ' + x.description + ' ' + x.tagline + ' ' + x.tags.map(z => TAG_RU[z]).join(' ') + ' ' + x.summary.critics.verdict).toLowerCase(); return [x, words.reduce((s, w) => s + (hay.includes(w.slice(0, Math.max(4, w.length - 2))) ? 1 : 0), 0)]; }).filter(([, s]) => s > 0).sort((a, b) => b[1] - a[1] || (b[0].metascore ?? 0) - (a[0].metascore ?? 0)).slice(0, 4);
    items = scored.map(([x]) => ({ g: x, why: x.tagline }));
    text = items.length ? 'Вот что нашлось по смыслу запроса:' : 'Не нашёл подходящих игр. Попробуйте спросить про платформу, жанр, аспект (графика, оптимизация, цена) или назовите игру.';
  }
  steps.push(['answer', `compose(cards=${items.length}, cite=true)`]);
  return { steps, text, items };
}

function renderChat() {
  app.innerHTML = `<section class="page">
    <div class="lhead"><div><div class="kicker">RAG по базе</div><h1>Чат с базой</h1><p class="fresh"><span class="live-dot"></span>Отвечает только по играм из базы, со ссылками на карточки · данные на ${fmtCollected()} МСК</p></div></div>
    <div class="chat">
      <div class="chatbox"><div class="msgs" id="msgs"></div>
        <form class="composer" id="composer"><input id="cq" placeholder="Например: лучшие JRPG на PS5" autocomplete="off"><button class="btn" type="submit" aria-label="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button></form>
      </div>
      <aside class="mapside"><div class="mcard"><h3>Попробуйте спросить</h3><div class="sugg" id="sugg">${SUGG.map(s => `<button>${esc(s)}</button>`).join('')}</div></div>
      <div class="mcard"><h3>Как это работает</h3><p class="mapnote" style="margin:0">Агент разбирает вопрос, выбирает инструмент (SQL по оценкам и платформам или поиск по эмбеддингам) и собирает ответ с карточками. В прототипе шаги выполняются локально над данными страницы.</p></div></aside>
    </div></section>`;
  if (!CHAT.msgs.length) CHAT.msgs.push({ role: 'a', text: `Привет! Я знаю ${G.length} свежих ${plural(G.length, 'игру', 'игры', 'игр')} с Metacritic: оценки по платформам, резюме отзывов и аспекты. Спросите, во что поиграть, или сравните мнения критиков и игроков.`, steps: [], items: [] });
  drawMsgs();
  $('#composer').addEventListener('submit', e => { e.preventDefault(); ask($('#cq').value); });
  $('#sugg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) ask(b.textContent); });
}
function msgHTML(m) {
  if (m.role === 'u') return `<div class="msg u">${esc(m.text)}</div>`;
  if (m.pending) return `<div class="msg a"><span class="avatar"></span><div class="abody">${m.steps.length ? `<div class="steps">${m.steps.map(s => `<div class="step"><b>${s[0]}</b><code>${esc(s[1])}</code></div>`).join('')}</div>` : ''}<span class="typing"><i></i><i></i><i></i></span></div></div>`;
  return `<div class="msg a"><span class="avatar"></span><div class="abody">${m.steps.length ? `<div class="steps">${m.steps.map(s => `<div class="step"><b>${s[0]}</b><code>${esc(s[1])}</code></div>`).join('')}</div>` : ''}<p>${m.text}</p>${m.items.length ? `<div class="ans-list">${m.items.map(it => `<a class="ans" href="#/game/${it.g.slug}">${cover(it.g, '', false)}<div style="min-width:0"><b>${esc(it.g.title)}</b><span>${esc(it.why)}</span></div>${msBadge(it.g.metascore)}</a>`).join('')}</div>` : ''}</div></div>`;
}
function drawMsgs() { const el = $('#msgs'); if (!el) return; el.innerHTML = CHAT.msgs.map(msgHTML).join(''); const last = el.lastElementChild; if (last && CHAT.msgs.length > 1) last.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
function ask(q) {
  q = q.trim(); if (!q || CHAT.busy) return;
  const inp = $('#cq'); if (inp) inp.value = '';
  CHAT.busy = true;
  CHAT.msgs.push({ role: 'u', text: q });
  const res = agent(q);
  const m = { role: 'a', pending: true, steps: [], text: res.text, items: res.items };
  CHAT.msgs.push(m); drawMsgs();
  res.steps.forEach((s, i) => setTimeout(() => { m.steps.push(s); drawMsgs(); }, 350 + i * 420));
  setTimeout(() => { m.pending = false; CHAT.busy = false; drawMsgs(); }, 500 + res.steps.length * 420);
}

const STAGES = [
  { k: 'collect', n: 'Сбор', d: 'composer + finder API Metacritic, 1 запрос/сек' },
  { k: 'parse', n: 'Разбор', d: 'нормализация, upsert по slug' },
  { k: 'summary', n: 'Резюме', d: 'LLM, structured output с цитатами' },
  { k: 'embed', n: 'Эмбеддинги', d: 'описание + теги + аспекты' },
  { k: 'similar', n: 'Похожие', d: 'kNN в pgvector, объяснения' },
];
const PRICE = { in: 0.40, out: 1.60, emb: 0.02 }; // $ за 1M токенов, задаётся в env сервиса
const DUR = { collect: [700, 1300], parse: [250, 500], summary: [1600, 3200], embed: [300, 600], similar: [200, 400] };
const now0 = new Date();
const runsToday = Math.max(1, now0.getHours());
const SIM = {
  running: false, items: [], log: [], costRows: [], done: [0, 0, 0, 0, 0], total: 20,
  workers: [
    { id: 'collector-1', st: 'collect', status: 'idle', job: null, n: 0 },
    { id: 'parser-1', st: 'parse', status: 'idle', job: null, n: 0 },
    { id: 'llm-1', st: 'summary', status: 'idle', job: null, n: 0 },
    { id: 'llm-2', st: 'summary', status: 'idle', job: null, n: 0 },
    { id: 'embedder-1', st: 'embed', status: 'idle', job: null, n: 0 },
    { id: 'matcher-1', st: 'similar', status: 'idle', job: null, n: 0 },
  ],
  base: { games: 4812, today: (runsToday) * 20, errors: 3, reviews: 0, tokens: 0, cost: 0 },
  runNo: runsToday, cursor: runsToday, hist: Array.from({ length: 11 }, (_, i) => ({ n: 20, err: i === 4 })),
  batch: null, started: null,
};
const rnd = (a, b) => a + Math.random() * (b - a);
const ts = () => { const d = new Date(); return d.toTimeString().slice(0, 8); };
function slog(w, msg, cls = 'inf') { SIM.log.push({ t: ts(), w, msg, cls }); if (SIM.log.length > 160) SIM.log.shift(); }
slog('scheduler', `Сегодня ${runsToday} ${plural(runsToday, 'запуск', 'запуска', 'запусков')}: New Releases обработан, курсор SEE ALL на стр. ${SIM.cursor}`, 'inf');
slog('scheduler', 'Воркеры на месте, жду следующего часа', 'ok');

function startRun(manual) {
  if (SIM.running) { toast('Запуск уже идёт: повторный старт заблокирован (advisory lock в БД)'); slog('api', 'POST /api/runs → 409 Conflict: run already in progress', 'wr'); updMonitor(); return; }
  SIM.running = true; SIM.started = Date.now(); SIM.done = [0, 0, 0, 0, 0]; SIM.costRows = [];
  SIM.runNo++;
  const fromNew = SIM.runNo === 1;
  SIM.cursor++;
  const pool = fromNew ? G.filter(g => g.inNewReleases).map(g => ({ title: g.title, upd: true })) : DB.seeAll.map(t => ({ title: t, upd: false })).concat(G.map(g => ({ title: g.title, upd: true })));
  const skipped = fromNew ? [] : [G[0].title, G[3].title];
  const items = pool.filter(p => !skipped.includes(p.title)).slice(0, 20);
  SIM.batch = fromNew ? 'New Releases (главная /game/)' : `SEE ALL · новые · стр. ${SIM.cursor}`;
  SIM.total = items.length;
  SIM.items = items.map((p, i) => ({ id: i, title: p.title, upd: p.upd, stage: 0, state: 'queued', retry: !fromNew && i === 6 }));
  slog('api', manual ? 'POST /api/runs → 202 Accepted (ручной запуск)' : 'scheduler: запуск по расписанию', 'ok');
  slog('scheduler', `Run #${SIM.runNo}: источник ${SIM.batch}`, 'inf');
  if (skipped.length) slog('collector-1', `Пропуск ${skipped.length}: уже обработаны сегодня, добираю со следующей позиции`, 'inf');
  $('#navPulse').hidden = false;
  updMonitor();
}

function tick() {
  if (SIM.running) {
    const t = Date.now();
    for (const w of SIM.workers) {
      const si = STAGES.findIndex(s => s.k === w.st);
      if (w.job && t >= w.until) {
        const it = w.job;
        if (w.st === 'collect' && it.retry) {
          it.retry = false; w.status = 'retry'; w.until = t + 1400;
          slog(w.id, `HTTP 429 на «${it.title}», повтор через 1.4 с (экспоненциальная пауза)`, 'wr'); SIM.base.errors++;
          continue;
        }
        w.n++; SIM.done[si]++;
        if (w.st === 'collect') { it.rev = Math.round(rnd(8, 60)); SIM.base.reviews += it.rev; slog(w.id, `«${it.title}»: ${it.upd ? 'обновление' : 'новая игра'}, ${it.rev} отзывов, платформ ${Math.ceil(rnd(1, 4))}`, 'inf'); }
        if (w.st === 'parse') slog(w.id, `upsert games/${it.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')} ok`, 'inf');
        if (w.st === 'summary') { it.tin = Math.round(1800 + it.rev * rnd(90, 140)); it.tout = Math.round(rnd(550, 1050)); slog(w.id, `резюме + 6 аспектов: ${it.tin.toLocaleString('ru')} → ${it.tout.toLocaleString('ru')} токенов, цитаты сверены`, 'inf'); }
        if (w.st === 'embed') { it.temb = Math.round(rnd(700, 1400)); slog(w.id, `вектор 1536d для «${it.title}»`, 'inf'); }
        if (w.st === 'similar') {
          const cost = (it.tin * PRICE.in + it.tout * PRICE.out + it.temb * PRICE.emb) / 1e6;
          it.cost = cost; SIM.costRows.unshift(it); SIM.base.tokens += it.tin + it.tout + it.temb; SIM.base.cost += cost; SIM.base.today++; if (!it.upd) SIM.base.games++;
          slog(w.id, `«${it.title}»: 5 похожих, $${cost.toFixed(4)}`, 'ok');
        }
        it.stage = si + 1; it.state = it.stage >= STAGES.length ? 'done' : 'queued';
        w.job = null; w.status = 'idle';
      }
      if (!w.job) {
        const next = SIM.items.find(it => it.state === 'queued' && it.stage === si);
        if (next) { next.state = 'work'; w.job = next; w.status = 'busy'; const [a, b] = DUR[w.st]; w.until = t + rnd(a, b); }
      }
    }
    if (SIM.items.every(it => it.state === 'done')) {
      SIM.running = false;
      const sec = ((Date.now() - SIM.started) / 1000).toFixed(1);
      const total = SIM.costRows.reduce((s, r) => s + r.cost, 0);
      SIM.hist.push({ n: SIM.total, err: false }); if (SIM.hist.length > 12) SIM.hist.shift();
      slog('scheduler', `Run #${SIM.runNo} завершён: ${SIM.total} игр за ${sec} с, $${total.toFixed(3)} ($${(total / SIM.total).toFixed(4)} на игру)`, 'ok');
      $('#navPulse').hidden = true;
    }
  }
  if (route().name === 'monitor') updMonitor();
}
setInterval(tick, 150);

function nextHour() { const d = new Date(); d.setMinutes(60, 0, 0); return d; }

function renderMonitor() {
  app.innerHTML = `<section class="page">
    <div class="mhead">
      <div><div class="kicker">Конвейер · раз в час</div><h1>Мониторинг</h1><p class="fresh"><span class="live-dot"></span>В реальном времени через SSE · в прототипе работа конвейера симулируется</p></div>
      <div class="mctl"><span class="state-pill" id="stpill"><i></i><span></span></span><div class="nextrun">следующий запуск<br><b id="countdown">--:--</b></div>
        <button class="btn" id="runBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>Запустить сейчас</button></div>
    </div>
    <div class="pipe"><div class="pipe-top"><div class="batch" id="batch"></div><div class="batch" id="elapsed"></div></div>
      <div class="stages" id="stages">${STAGES.map((s, i) => `<div class="stage" data-i="${i}"><div class="stage-in"><div><div class="num">0${i + 1}</div><h3>${s.n}</h3><p>${s.d}</p></div><div class="cnt"><span>0</span><small>/20</small></div><div class="sbar"><i></i></div><div class="cur"></div></div></div>`).join('')}</div>
    </div>
    <div class="counters" id="counters"></div>
    <div class="mgrid">
      <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
        <div class="panel"><h2>Воркеры <small>heartbeat 5 с</small></h2><table class="tbl"><thead><tr><th>Воркер</th><th>Статус</th><th>Задача</th><th class="r">Готово</th></tr></thead><tbody id="workers"></tbody></table></div>
        <div class="panel"><h2>Стоимость по играм <small>LLM_MODEL из env · $${PRICE.in}/$${PRICE.out} за 1M</small></h2><table class="tbl"><thead><tr><th>Игра</th><th class="r hide-m">Вход</th><th class="r hide-m">Выход</th><th class="r">Токены</th><th class="r">$</th></tr></thead><tbody id="costs"></tbody></table></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
        <div class="panel"><h2>Лог <small>последние события</small></h2><div class="log" id="log"></div></div>
        <div class="panel"><h2>Состояние обхода</h2><dl class="crawl" id="crawl"></dl><div class="hist" id="hist"></div><div class="hist-l"><span>12 ч назад</span><span>сейчас</span></div></div>
      </div>
    </div></section>`;
  $('#runBtn').addEventListener('click', () => startRun(true));
  SIM.logShown = 0;
  updMonitor();
  if (!SIM.autostarted) { SIM.autostarted = true; setTimeout(() => startRun(false), 900); }
}

function updMonitor() {
  if (!$('#stages')) return;
  const run = SIM.running;
  const pill = $('#stpill'); pill.classList.toggle('run', run); pill.lastElementChild.textContent = run ? `run #${SIM.runNo} выполняется` : 'ожидание';
  $('#runBtn').toggleAttribute('disabled', run); $('#runBtn').lastChild.textContent = run ? 'Идёт обработка' : 'Запустить сейчас';
  const ms = nextHour() - new Date(); $('#countdown').textContent = `${String(Math.floor(ms / 60000)).padStart(2, '0')}:${String(Math.floor(ms % 60000 / 1000)).padStart(2, '0')}`;
  $('#batch').innerHTML = SIM.batch ? `Источник: <b>${esc(SIM.batch)}</b> · ${SIM.total} игр` : 'Источник: <b>ожидание запуска</b>';
  $('#elapsed').textContent = SIM.started ? (run ? `идёт ${((Date.now() - SIM.started) / 1000).toFixed(0)} с` : 'последний запуск завершён') : '';
  $$('#stages .stage').forEach((el, i) => {
    const active = SIM.workers.some(w => w.st === STAGES[i].k && w.job);
    const done = SIM.done[i];
    el.classList.toggle('active', active); el.classList.toggle('done', done >= SIM.total && SIM.started != null); el.classList.toggle('flow', run && SIM.done[i] > SIM.done[i + 1 >= 5 ? 4 : i + 1] - 0 && i < 4 && done > 0);
    el.querySelector('.cnt span').textContent = done; el.querySelector('.cnt small').textContent = '/' + SIM.total;
    el.querySelector('.sbar i').style.width = (done / SIM.total * 100) + '%';
    const w = SIM.workers.find(w => w.st === STAGES[i].k && w.job);
    el.querySelector('.cur').textContent = w ? '▸ ' + w.job.title : '';
  });
  const runCost = SIM.costRows.reduce((s, r) => s + r.cost, 0), n = SIM.costRows.length;
  const C = [['Игр в базе', SIM.base.games.toLocaleString('ru')], ['Обработано сегодня', SIM.base.today], ['Отзывов разобрано', (14230 + SIM.base.reviews).toLocaleString('ru')], ['Ошибок и ретраев', SIM.base.errors], ['Токенов за run', SIM.costRows.reduce((s, r) => s + r.tin + r.tout + r.temb, 0).toLocaleString('ru')], ['$ на игру', n ? '$' + (runCost / n).toFixed(4) : '—', true]];
  $('#counters').innerHTML = C.map(([a, b, acid]) => `<div class="ctr"><span>${a}</span><b class="${acid ? 'acid' : ''}">${b}</b></div>`).join('');
  $('#workers').innerHTML = SIM.workers.map(w => `<tr><td class="mono">${w.id}</td><td><span class="wst ${w.status}"><i></i>${w.status}</span></td><td class="job">${w.job ? esc(w.job.title) : '<span class="dim">—</span>'}</td><td class="r mono">${w.n}</td></tr>`).join('');
  $('#costs').innerHTML = n ? SIM.costRows.slice(0, 6).map(r => `<tr><td class="job" style="color:var(--text)">${esc(r.title)}</td><td class="r mono hide-m">${r.tin.toLocaleString('ru')}</td><td class="r mono hide-m">${r.tout.toLocaleString('ru')}</td><td class="r mono">${(r.tin + r.tout + r.temb).toLocaleString('ru')}</td><td class="r mono" style="color:var(--acid)">${r.cost.toFixed(4)}</td></tr>`).join('') + `<tr><td><b>Итого за run</b></td><td class="hide-m"></td><td class="hide-m"></td><td class="r mono">${n} ${plural(n, 'игра', 'игры', 'игр')}</td><td class="r mono"><b>$${runCost.toFixed(3)}</b></td></tr>` : `<tr><td colspan="5" class="dim">Появится после первой обработанной игры</td></tr>`;
  const log = $('#log');
  if (SIM.logShown !== SIM.log.length || log.childElementCount === 0) {
    log.innerHTML = SIM.log.slice(-80).map(l => `<div><span class="t">${l.t}</span> <span class="w">${l.w.padEnd(11)}</span> <span class="${l.cls}">${esc(l.msg)}</span></div>`).join('');
    log.scrollTop = log.scrollHeight; SIM.logShown = SIM.log.length;
  }
  $('#crawl').innerHTML = `<dt>Дата обхода</dt><dd>${new Date().toISOString().slice(0, 10)} · сброс в 00:00</dd><dt>New Releases</dt><dd>${SIM.runNo >= 1 ? 'обработан ✓' : 'в очереди'}</dd><dt>Курсор SEE ALL</dt><dd>стр. ${SIM.cursor} (sort=new)</dd><dt>Уникальность</dt><dd>не повторяем игры, обработанные сегодня</dd>`;
  const hist = SIM.hist.concat(run ? [{ n: SIM.done[4], cur: true }] : []).slice(-12);
  $('#hist').innerHTML = hist.map(h => `<div class="${h.cur ? 'cur' : h.err ? 'err' : ''}" style="height:${Math.max(5, h.n / 20 * 100)}%" title="${h.n} игр${h.err ? ', были ретраи' : ''}"></div>`).join('');
}

/* ===================== ROUTER ===================== */
const app = document.getElementById('app');
function route() { const h = location.hash.replace(/^#\/?/, ''); if (h.startsWith('game/')) return { name: 'game', slug: h.slice(5) }; return { name: ['map', 'chat', 'monitor'].includes(h) ? h : 'list' }; }
let lastRoute = '';
function render() {
  const r = route(); hideTip();
  const key = r.name + (r.slug || '');
  if (key === lastRoute) return; lastRoute = key;
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === (r.name === 'game' ? 'list' : r.name)));
  if (r.name === 'game') renderDetail(r.slug); else if (r.name === 'map') renderMap(); else if (r.name === 'chat') renderChat(); else if (r.name === 'monitor') renderMonitor(); else renderList();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', render);
let lastMob = innerWidth < 820;
addEventListener('resize', () => { const m = innerWidth < 820; if (m !== lastMob && route().name === 'map') { lastMob = m; lastRoute = ''; render(); } lastMob = m; });
$('#foot').textContent = `данные на ${fmtCollected()} МСК`;
render();
</script>
</body>
</html>
