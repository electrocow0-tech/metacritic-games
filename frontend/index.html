<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorecast · анализ свежих игр Metacritic</title>
<meta name="description" content="Свежие игры Metacritic: оценки по платформам, резюме отзывов критиков и игроков, похожие игры и мониторинг конвейера сбора.">
<meta name="theme-color" content="#07090d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --bg2:#0c1017; --panel:#10151e; --panel2:#151b26; --line:#1f2733; --line2:#2a3443;
  --text:#e8edf4; --muted:#8a96a8; --dim:#5b6676;
  --critic:#38d9f5; --player:#ff6b8b; --acid:#c8ff3d; --warn:#ffb547;
  --good:#3ddc84; --mid:#ffc93d; --bad:#ff5a5a;
  --r:14px; --r2:20px;
  --f-display:"Unbounded", "Arial Black", sans-serif;
  --f-body:"Onest", "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:clip}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg,video,iframe,canvas{max-width:100%}
h1,h2,h3,h4,b,.ctitle,.tagline,.ins b,.ins span,.ans b,.ans span,.sim li,.pc li,.verdict,.desc,.facts dd{overflow-wrap:anywhere}
.lhead>*,.toolbar>*,.gcard,.gbody,.ins>div,.bigsc>div,.sumcol,.mhead>*,.mctl>*,.sim,.mcard,.stage-in>div,.dinfo>*,.msg{min-width:0}
.ptable table{table-layout:fixed}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(56,217,245,.10), transparent 60%),
    radial-gradient(700px 500px at -10% 30%, rgba(255,107,139,.07), transparent 60%),
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px) 0 0/100% 4px;}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 28px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(7,9,13,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap}
.logo-mark{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 210deg,var(--critic),var(--acid),var(--player),var(--critic));position:relative}
.logo-mark::after{content:"";position:absolute;inset:6px;border-radius:4px;background:var(--bg)}
.logo small{font:500 11px/1 var(--f-mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;transition:.2s}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.on{color:var(--bg);background:var(--acid)}
.nav svg{width:17px;height:17px;flex:none}
.nav .pulse{width:7px;height:7px;border-radius:50%;background:var(--acid);box-shadow:0 0 0 0 rgba(200,255,61,.6);animation:pulse 1.6s infinite}
.nav a.on .pulse{background:var(--bg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,255,61,.55)}70%{box-shadow:0 0 0 8px rgba(200,255,61,0)}100%{box-shadow:0 0 0 0 rgba(200,255,61,0)}}

main{position:relative;z-index:1;padding:28px 0 80px}
.page{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.kicker{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.fresh{display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1.3 var(--f-mono);color:var(--muted)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);flex:none}
.muted{color:var(--muted)} .dim{color:var(--dim)}

/* ---------- scores ---------- */
.s-good{--sc:var(--good)} .s-mid{--sc:var(--mid)} .s-bad{--sc:var(--bad)} .s-none{--sc:var(--dim)}
.ms{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border-radius:10px;background:var(--sc);color:#06120b;font:800 18px/1 var(--f-display)}
.ms.s-none,.us.s-none{background:transparent;border:1px dashed var(--line2);color:var(--muted);font:600 10.5px/1.15 var(--f-body);text-align:center;letter-spacing:0;width:auto;min-width:58px}
.us{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border-radius:50%;border:3px solid var(--sc);color:var(--text);font:800 15px/1 var(--f-display)}
.us.s-none{border-radius:10px}
.sc-txt{font-family:var(--f-mono);font-weight:600;color:var(--sc)}

/* ---------- covers (game-styled placeholders, no copied art) ---------- */
.cover{position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 78% 18%, color-mix(in srgb,var(--c3) 70%, transparent), transparent 52%),
             linear-gradient(145deg,var(--c1) 10%,var(--c2) 65%,color-mix(in srgb,var(--c3) 60%, var(--c2)));}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.9}
.cover::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,transparent 35%,rgba(5,7,10,.78))}
.pat-stripes::before{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 13px)}
.pat-grid::before{background:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 0 0/22px 22px}
.pat-dots::before{background:radial-gradient(rgba(255,255,255,.16) 1.3px,transparent 1.8px) 0 0/13px 13px}
.pat-rays::before{background:repeating-conic-gradient(from 0deg at 82% 12%,rgba(255,255,255,.08) 0 5deg,transparent 5deg 15deg)}
.pat-waves::before{background:repeating-radial-gradient(circle at 0 110%,rgba(255,255,255,.08) 0 2px,transparent 2px 15px)}
.pat-pixels::before{background:conic-gradient(rgba(255,255,255,.07) 25%,transparent 0 50%,rgba(255,255,255,.07) 0 75%,transparent 0) 0 0/16px 16px}
.pat-hex::before{background:repeating-linear-gradient(60deg,rgba(255,255,255,.06) 0 1.5px,transparent 1.5px 16px),repeating-linear-gradient(-60deg,rgba(255,255,255,.06) 0 1.5px,transparent 1.5px 16px)}
.pat-rings::before{background:repeating-radial-gradient(circle at 72% 30%,rgba(255,255,255,.09) 0 1.5px,transparent 1.5px 17px)}
.cover .mono-bg{position:absolute;right:-6%;top:-14%;font:800 clamp(80px,13vw,170px)/1 var(--f-display);color:rgba(255,255,255,.07);letter-spacing:-.06em;z-index:0;pointer-events:none}
.cover .ctitle{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;font:800 17px/1.08 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.5)}

/* ---------- list ---------- */
.lhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px;flex-wrap:wrap}
.lhead h1{font-size:clamp(28px,3.6vw,44px);line-height:1.02}
.lhead h1 em{font-style:normal;color:var(--acid)}
.lhead p{margin:10px 0 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px;transition:border-color .2s}
.search:focus-within{border-color:var(--acid)}
.search input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0}
.search svg{width:18px;height:18px;color:var(--dim);flex:none}
.select{position:relative}
.select select{appearance:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:46px;padding:0 40px 0 14px;font-weight:600;cursor:pointer}
.select::after{content:"";position:absolute;right:16px;top:19px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.chip i{font-style:normal;font:500 11px/1 var(--f-mono);color:var(--dim)}
.chip:hover{color:var(--text);border-color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.on i{color:#556}
.count-line{font:500 12px/1 var(--f-mono);color:var(--dim);margin:-8px 0 16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(285px,100%),1fr));gap:18px}
.gcard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;animation:rise .5s both;animation-delay:calc(var(--i,0)*35ms)}
.gcard:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 40px -18px rgba(0,0,0,.8),0 0 0 1px color-mix(in srgb,var(--c3) 35%,transparent)}
.gcard .cover{aspect-ratio:16/9}
.gcard .scorebox{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:6px}
.gcard .scorebox .ms,.gcard .scorebox .us{height:38px;min-width:38px;font-size:15px}
.gcard .scorebox .us{background:rgba(5,7,10,.55);backdrop-filter:blur(4px)}
.gcard .scorebox .s-none{background:rgba(5,7,10,.55);backdrop-filter:blur(4px);font-size:10px;min-width:54px}
.gcard .newtag{position:absolute;top:14px;right:12px;z-index:2;font:600 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:rgba(5,7,10,.6);color:var(--acid)}
.gbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.gbody .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.gbody .meta span{min-width:0;overflow-wrap:anywhere}
.gbody .meta span+span::before{content:"·";margin-right:10px;color:var(--dim)}
.gbody .tagline{font-size:13.5px;color:var(--text);opacity:.85;margin:0}
.plats{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font:600 11.5px/1 var(--f-mono);color:var(--muted)}
.pchip b{font-weight:600}
.pchip .sep{width:1px;height:12px;background:var(--line2)}
.flag{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1.2 var(--f-mono);color:var(--warn)}
.flag::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--warn);transform:rotate(45deg)}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r2)}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:16px}
.back:hover{color:var(--text)}
.dhero{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.dhero-bg{position:absolute;inset:0;opacity:.55}
.dhero-bg::after{background:linear-gradient(90deg,rgba(7,9,13,.92) 30%,rgba(7,9,13,.55))}
.dhero-in{position:relative;z-index:2;display:grid;grid-template-columns:250px minmax(0,1fr) 360px;gap:32px;padding:32px}
.dcover{aspect-ratio:3/4;border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.08)}
.dcover .ctitle{font-size:22px}
.dinfo{min-width:0;display:flex;flex-direction:column;gap:12px}
.dinfo h1{font-size:clamp(26px,3.2vw,42px);line-height:1.04}
.dinfo .tl{font-size:16px;color:var(--text);opacity:.85;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 12px/1 var(--f-body);padding:6px 9px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#c9d2de}
.tag.g{color:var(--acid);border-color:color-mix(in srgb,var(--acid) 30%,transparent)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px;margin:4px 0 0}
.facts dt{color:var(--dim)} .facts dd{margin:0}
.scoreboard{display:flex;flex-direction:column;gap:12px}
.bigscores{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.bigsc{background:rgba(5,7,10,.55);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(6px)}
.bigsc .ms,.bigsc .us{height:56px;min-width:56px;font-size:22px}
.bigsc .ms.s-none,.bigsc .us.s-none{font-size:11px;min-width:64px}
.bigsc div>b{display:block;font-size:13px}
.bigsc div>span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.ptable{background:rgba(5,7,10,.55);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(6px)}
.ptable table{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{font:600 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.ptable td{padding:9px 12px;border-bottom:1px solid var(--line)}
.ptable tr:last-child td{border-bottom:0}
.ptable td small{color:var(--dim);font-family:var(--f-mono);font-size:11px;margin-left:4px}
.ptable .na{color:var(--dim);font-size:12px}

.subnav{position:sticky;top:64px;z-index:20;display:flex;gap:4px;padding:10px 0;margin:8px 0 6px;background:linear-gradient(var(--bg) 70%,transparent);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{padding:8px 13px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap}
.subnav button:hover{color:var(--text);background:var(--panel)}
.sec{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:26px;scroll-margin-top:120px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-size:21px}
.sec-h .note{font:500 12px/1.3 var(--f-mono);color:var(--dim)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px}
.desc{margin:0;color:#cfd7e2;font-size:15.5px;line-height:1.65}
.video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#000}
.video .cover{position:absolute;inset:0}
.video .cover::after{background:rgba(5,7,10,.55)}
.video button.play{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.play-ico{width:68px;height:68px;border-radius:50%;background:var(--acid);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(200,255,61,.15);transition:transform .2s}
.video button.play:hover .play-ico{transform:scale(1.08)}
.play-ico svg{width:24px;height:24px;margin-left:4px;color:var(--bg)}
.video .vt{font-weight:600;font-size:14px;max-width:420px;text-shadow:0 2px 10px #000}
.video .vd{font:500 12px/1 var(--f-mono);color:#c7d0dc}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.novideo{display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px;z-index:3;position:absolute;inset:0}

/* summary */
.sumgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.sumcol{border-radius:16px;padding:20px;background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--sc2)}
.sumcol.c{--sc2:var(--critic)} .sumcol.p{--sc2:var(--player)}
.sumcol header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sumcol h3{font-size:16px;color:var(--sc2)}
.analyzed{font:500 11.5px/1.3 var(--f-mono);color:var(--dim)}
.verdict{font-size:15px;line-height:1.55;margin:0 0 14px;color:#dbe2ec}
.pc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pc li{border-radius:10px;padding:9px 10px 9px 34px;position:relative;font-size:14px;cursor:pointer;transition:background .15s}
.pc li:hover{background:var(--panel2)}
.pc li::before{position:absolute;left:10px;top:9px;width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font:700 12px/16px var(--f-mono);text-align:center}
.pc.plus li::before{content:"+";background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pc.minus li::before{content:"−";background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pc li q{display:none;margin-top:6px;font-size:13px;font-style:italic;color:var(--muted);quotes:"«" "»"}
.pc li.open q{display:block}
.pc li q::after{content:close-quote}
.pc li .qsrc{display:none;font:500 11px/1.3 var(--f-mono);color:var(--dim);margin-top:3px}
.pc li.open .qsrc{display:block}
.pc-h{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.nodata{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line2);border-radius:12px}

/* letsplay */
.lp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px}
.lpv{border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#000}
.lpv .cover{aspect-ratio:16/9}
.lpv .cover::after{background:linear-gradient(180deg,rgba(5,7,10,.25),rgba(5,7,10,.75))}
.lpv .lptitle{position:absolute;left:16px;right:16px;top:14px;z-index:2;font-weight:600;font-size:14px;text-shadow:0 2px 8px #000}
.lpv .lpnow{position:absolute;left:16px;bottom:14px;z-index:2;font:600 13px/1 var(--f-mono);background:rgba(5,7,10,.7);padding:6px 8px;border-radius:7px}
.lpv .play-ico{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:58px;height:58px}
.tl-bar{position:relative;height:34px;background:#0a0d12;border-top:1px solid var(--line)}
.tl-track{position:absolute;left:14px;right:14px;top:15px;height:4px;border-radius:3px;background:var(--line2)}
.tl-prog{position:absolute;left:0;top:0;bottom:0;background:var(--acid);border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.tl-mk{position:absolute;top:-5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--panel2);border:2px solid var(--acid);cursor:pointer;transition:transform .15s}
.tl-mk:hover,.tl-mk.on{transform:scale(1.25);background:var(--acid)}
.lp-sum{margin:0 0 14px;color:#dbe2ec;line-height:1.6}
.moments{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.moments button{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;padding:9px 10px;border-radius:10px;font-size:14px;transition:background .15s}
.moments button:hover,.moments button.on{background:var(--panel2)}
.moments time{font:600 12.5px/1 var(--f-mono);color:var(--acid);min-width:56px}
.lp-link{font:500 12px/1.4 var(--f-mono);color:var(--dim);margin-top:10px;overflow-wrap:anywhere}

/* similar */
.simgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sim{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.sim:hover{transform:translateY(-3px);border-color:var(--line2)}
.sim .cover{aspect-ratio:16/8}
.sim .cover .ctitle{font-size:14px}
.sim .pct{position:absolute;top:10px;right:10px;z-index:2;font:700 12px/1 var(--f-mono);padding:5px 7px;border-radius:7px;background:rgba(5,7,10,.65);color:var(--acid)}
.sim ul{margin:0;padding:12px 14px 14px;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#c9d2de}
.sim li{display:flex;gap:8px}
.sim li::before{content:"";flex:none;width:5px;height:5px;margin-top:8px;border-radius:50%;background:var(--acid)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 20px;border-radius:12px;background:var(--acid);color:var(--bg);font-weight:700;transition:transform .15s,filter .15s,opacity .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:18px;height:18px}
/* ---------- monitor ---------- */
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.mhead h1{font-size:clamp(26px,3vw,38px)}
.mctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.nextrun{font:500 12.5px/1.4 var(--f-mono);color:var(--muted);text-align:right}
.nextrun b{color:var(--text);font-size:15px}
.state-pill{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--f-mono);padding:8px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.state-pill.run{color:var(--acid);border-color:color-mix(in srgb,var(--acid) 40%,transparent)}
.state-pill i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.state-pill.run i{background:var(--acid);animation:pulse 1.4s infinite}
.pipe{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:22px;margin-bottom:18px}
.pipe-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.batch{font:500 12.5px/1.4 var(--f-mono);color:var(--muted)}
.batch b{color:var(--text)}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative}
.stage{position:relative;padding:0 8px}
.stage-in{position:relative;z-index:1;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;transition:border-color .3s,box-shadow .3s,background .3s}
.stage.active .stage-in{border-color:var(--acid);box-shadow:0 0 0 4px rgba(200,255,61,.08),0 0 30px -6px rgba(200,255,61,.35);background:color-mix(in srgb,var(--acid) 4%,var(--bg2))}
.stage.done .stage-in{border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.stage .num{font:600 11px/1 var(--f-mono);color:var(--dim);letter-spacing:.1em}
.stage h3{font-size:15px;margin:8px 0 4px}
.stage p{margin:0;font-size:12px;color:var(--muted);min-height:32px}
.stage .cnt{font:700 22px/1 var(--f-display);margin-top:12px}
.stage .cnt small{font:500 12px var(--f-mono);color:var(--dim)}
.stage .sbar{height:4px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.stage .sbar i{display:block;height:100%;width:0;background:var(--acid);transition:width .3s}
.stage .cur{font:500 11px/1.3 var(--f-mono);color:var(--acid);margin-top:8px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage:not(:last-child)::after{content:"";position:absolute;z-index:0;top:50%;right:-8px;width:16px;height:2px;background:var(--line2)}
.stage.flow:not(:last-child)::after{background:linear-gradient(90deg,var(--acid) 50%,transparent 50%) 0 0/8px 2px;animation:flow .5s linear infinite}
@keyframes flow{to{background-position:8px 0}}
.counters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.ctr{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ctr span{font-size:12px;color:var(--muted)}
.ctr b{display:block;font:700 22px/1.2 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.ctr b.acid{color:var(--acid)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:20px;min-width:0}
.panel h2{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 small{font:500 11.5px var(--f-mono);color:var(--dim);letter-spacing:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:600 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:0 8px 10px}
.tbl td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .mono{font-size:12px}
.wst{display:inline-flex;align-items:center;gap:7px;font:600 11.5px/1 var(--f-mono)}
.wst i{width:8px;height:8px;border-radius:50%}
.wst.busy{color:var(--acid)} .wst.busy i{background:var(--acid);box-shadow:0 0 8px var(--acid)}
.wst.idle{color:var(--muted)} .wst.idle i{background:var(--dim)}
.wst.retry{color:var(--warn)} .wst.retry i{background:var(--warn)}
.job{color:var(--muted);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{height:330px;overflow:auto;font:12px/1.65 var(--f-mono);background:#06080b;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.log div{white-space:pre-wrap;word-break:break-word}
.log .t{color:var(--dim)} .log .w{color:#8ab4ff} .log .ok{color:var(--good)} .log .wr{color:var(--warn)} .log .inf{color:#b7c2d0}
.hist{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.hist div{flex:1;background:var(--line2);border-radius:4px 4px 0 0;position:relative;min-height:4px;transition:height .4s}
.hist div.cur{background:var(--acid)}
.hist div.err{background:linear-gradient(var(--warn) 0 6px,var(--line2) 6px)}
.hist-l{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:var(--dim);margin-top:6px}
.crawl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:13px}
.crawl dt{color:var(--dim)} .crawl dd{margin:0;font-family:var(--f-mono);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:300;background:#151b26;border:1px solid var(--warn);color:var(--text);padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:22px 0 34px;color:var(--dim);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .dhero-in{grid-template-columns:200px minmax(0,1fr)}
  .scoreboard{grid-column:1/-1}
  .simgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .counters{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:980px){
  .mgrid{grid-template-columns:minmax(0,1fr)}
  .stages{grid-template-columns:minmax(0,1fr);gap:10px}
  .stage{padding:0}
  .stage:not(:last-child)::after{top:auto;bottom:-10px;right:auto;left:28px;width:2px;height:10px}
  .stage.flow:not(:last-child)::after{background:var(--acid)}
  .stage-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:center}
  .stage p{min-height:0}
  .stage .cnt{margin:0;grid-row:1/3;grid-column:2;text-align:right}
  .stage .sbar,.stage .cur{grid-column:1/-1}
}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(7,9,13,.96)}
  .top .wrap{height:56px}
  .logo small{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:rgba(9,12,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:60}
  .nav a{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;flex:1;justify-content:center}
  .nav a.on{background:none;color:var(--acid)}
  .nav a.on .pulse{background:var(--acid)}
  .nav .pulse{position:absolute;margin:-20px 0 0 18px}
  .nav a{position:relative}
  main{padding:18px 0 100px}
  footer{padding-bottom:96px}
  .search{flex:1 1 100%}
  .select{flex:1 1 100%}
  .select select{width:100%}
  .nav a{flex:1 1 0;min-width:0;font-size:10px;letter-spacing:-.01em;padding:7px 2px}
  .nav a svg{width:20px;height:20px}
  .tbl{table-layout:fixed}
  .bigsc{flex-direction:column;align-items:flex-start;gap:10px}
  .bigsc div>b{overflow-wrap:normal}
  .tbl .job{max-width:none}
  .tbl th:first-child{width:34%}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 0 18px;padding:0;scrollbar-width:none;overscroll-behavior-x:contain}
  .chips::-webkit-scrollbar{display:none}
  .grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .dhero-in{grid-template-columns:minmax(0,1fr);padding:18px;gap:18px}
  .dcover{aspect-ratio:16/9}
  .two,.vs,.sumgrid,.lp{grid-template-columns:minmax(0,1fr);gap:20px}
  .sec{padding:18px;border-radius:16px}
  .subnav{top:56px}
  .simgrid{grid-template-columns:minmax(0,1fr)}
  .counters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl .hide-m{display:none}
  .mhead{align-items:flex-start}
  .nextrun{text-align:left}
}

/* ---------- service additions ---------- */
.cover img.cimg{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;z-index:-1;display:block}
.cover.has-img .mono-bg{display:none}
.cover.has-img::before{display:none}
.desc{white-space:pre-line}
.more{display:flex;justify-content:center;margin-top:22px}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--acid);filter:none}
.loading{padding:60px 20px;text-align:center;color:var(--muted);font:500 13px/1.4 var(--f-mono)}
.loading::before{content:"";display:inline-block;width:8px;height:8px;margin-right:10px;border-radius:50%;background:var(--acid);vertical-align:middle;animation:pulse 1.4s infinite}
.empty .btn{margin-top:16px;height:40px}
.simgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
.sim .scorebox{position:absolute;top:10px;left:10px;z-index:2;display:flex;gap:5px}
.sim .scorebox .ms,.sim .scorebox .us{height:32px;min-width:32px;font-size:13px}
.sim .scorebox .us{background:rgba(5,7,10,.7)}
.sim .scorebox .s-none{background:rgba(5,7,10,.7);font-size:9.5px;min-width:48px}
.moments a{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;padding:9px 10px;border-radius:10px;font-size:14px;transition:background .15s}
.moments a:hover,.moments a.on{background:var(--panel2)}
.moments a::after{content:"↗";margin-left:auto;color:var(--dim);font-size:12px}
.lpv>a{display:block;position:relative}
.lp-link a{color:var(--critic)}
.log .er{color:var(--bad)}
.wst.offline{color:var(--bad)} .wst.offline i{background:var(--bad)}
.llm-off{font:500 11.5px var(--f-mono);color:var(--warn);letter-spacing:0}
.hist div.fail{background:var(--warn)}
@media (max-width:1180px){ .simgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:820px){ .simgrid{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/"><span class="logo-mark"></span>SCORECAST<small>для Metacritic Games</small></a>
    <nav class="nav" id="nav">
      <a href="#/" data-r="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Игры</a>
      <a href="#/monitor" data-r="monitor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Мониторинг<span class="pulse" id="navPulse" hidden></span></a>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap"><span>Данные: публичные страницы Metacritic. Сервис не связан с Metacritic.</span><span class="mono" id="foot"></span></div></footer>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = document.getElementById('app');

const PLAT_SHORT = {'PlayStation 5':'PS5','PlayStation 4':'PS4','Xbox Series X':'Xbox X','Xbox One':'Xbox One','Nintendo Switch':'Switch','Nintendo Switch 2':'Switch 2','PC':'PC'};
const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS_FULL = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const SENT_RU = { 'Universal acclaim': 'всеобщее признание', 'Generally favorable': 'в целом положительно', 'Mixed or average': 'смешанные отзывы', 'Generally unfavorable': 'в целом отрицательно', 'Overwhelming dislike': 'резко отрицательно' };
const fmtDate = iso => { if (!iso) return 'дата не указана'; const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const mskParts = (d, opts) => Object.fromEntries(new Intl.DateTimeFormat('ru-RU', { timeZone: 'Europe/Moscow', hourCycle: 'h23', ...opts }).formatToParts(d).map(x => [x.type, x.value]));
const fmtMsk = iso => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return '—'; const p = mskParts(d, { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); return `${+p.day} ${MONTHS_FULL[p.month - 1]} ${p.year}, ${p.hour}:${p.minute}`; };
const fmtTime = iso => { const d = new Date(iso); if (isNaN(d)) return '--:--:--'; const p = mskParts(d, { hour: '2-digit', minute: '2-digit', second: '2-digit' }); return `${p.hour}:${p.minute}:${p.second}`; };
const fmtSec = s => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0'); };
const plural = (n, a, b, c) => { const n10 = n % 10, n100 = n % 100; return n10 === 1 && n100 !== 11 ? a : n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20) ? b : c; };
const num = v => v == null || v === '' ? null : Number(v);
const fmtInt = v => (num(v) ?? 0).toLocaleString('ru');
const list = v => Array.isArray(v) ? v : [];

// score helpers: null means "нет оценки" (Metacritic tbd), never 0
function cls(v, max) { v = num(v); if (v == null) return 's-none'; const x = max === 10 ? v * 10 : v; return x >= 75 ? 's-good' : x >= 50 ? 's-mid' : 's-bad'; }
function msBadge(v, extra = '') { v = num(v); return v == null ? `<span class="ms s-none ${extra}" title="Metascore ещё не рассчитан">нет<br>оценки</span>` : `<span class="ms ${cls(v,100)} ${extra}" title="Metascore">${v}</span>`; }
function usBadge(v, extra = '') { v = num(v); return v == null ? `<span class="us s-none ${extra}" title="Userscore ещё не рассчитан (tbd)">нет<br>оценки</span>` : `<span class="us ${cls(v,10)} ${extra}" title="Userscore">${v.toFixed(1)}</span>`; }
const scTxt = (v, max) => { v = num(v); return v == null ? '<span class="na">нет оценки</span>' : `<span class="sc-txt ${cls(v,max)}">${max === 10 ? v.toFixed(1) : v}</span>`; };
const overallDelta = g => (num(g.metascore) == null || num(g.userscore) == null) ? null : +(num(g.userscore) - num(g.metascore) / 10).toFixed(1);

// плейсхолдер обложки: палитра и узор детерминированно из slug
const PALETTES = [
  ['#141018', '#5a1e2a', '#e6d2b0'], ['#0b1420', '#1d4e6b', '#7fe0ff'], ['#10140c', '#3c5a1e', '#c8ff3d'],
  ['#170d14', '#6b1f4f', '#ff8fc8'], ['#0d1012', '#3a3f46', '#ffb547'], ['#0a1416', '#145c58', '#5ef2d0'],
  ['#140f0a', '#6b3a14', '#ffc070'], ['#0f0d18', '#3b2a7a', '#b49cff'], ['#160b0b', '#7a1d1d', '#ff6b5a'],
  ['#0b1210', '#2a4a3a', '#9fe0b0'],
];
const PATTERNS = ['stripes', 'grid', 'dots', 'rays', 'waves', 'pixels', 'hex', 'rings'];
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function look(slug) { const h = hashStr(String(slug || '')); return { pal: PALETTES[h % PALETTES.length], pat: PATTERNS[(h >>> 7) % PATTERNS.length] }; }

function cover(g, extra = '', withTitle = true, img = g.coverUrl) {
  const { pal: [a, b, c], pat } = look(g.slug);
  const title = g.title || '';
  const mono = title.replace(/[^A-Za-z0-9 ]/g, ' ').split(/\s+/).filter(w => w && !/^(the|of|and|a)$/i.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  return `<div class="cover pat-${pat} ${img ? 'has-img' : ''} ${extra}" style="--c1:${a};--c2:${b};--c3:${c}">${img ? `<img class="cimg" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" decoding="async">` : ''}<span class="mono-bg">${esc(mono)}</span>${withTitle ? `<span class="ctitle">${esc(title)}</span>` : ''}</div>`;
}
// если картинка не загрузилась, остаётся сгенерированный плейсхолдер
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.classList.contains('cimg')) { const c = t.parentElement; t.remove(); if (c) c.classList.remove('has-img'); }
}, true);

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }

async function api(path, opts) {
  const r = await fetch(path, { headers: { Accept: 'application/json' }, ...opts });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
const errBox = (text, retry = true) => `<div class="empty">${esc(text)}${retry ? '<br><button class="btn ghost" data-retry>Повторить</button>' : ''}</div>`;

/* ===================== META ===================== */
let META = null;
async function loadMeta() {
  try { META = await api('/api/meta'); } catch (e) { /* шапка покажет запасной текст */ }
  $('#foot').textContent = META && META.collectedAt ? `данные на ${fmtMsk(META.collectedAt)} МСК` : '';
  return META;
}

/* ===================== LIST ===================== */
const PAGE = 60;
const LS = { q: '', plats: new Set(), sort: 'meta', items: [], total: 0, req: 0, loading: false, error: null };

function freshLine() {
  if (!META) return 'Загрузка данных…';
  if (!META.collectedAt) return 'Данные ещё собираются · обход раз в час';
  return `Данные собраны ${fmtMsk(META.collectedAt)} МСК · ${META.total} ${plural(META.total, 'игра', 'игры', 'игр')} · обход раз в час`;
}
function chipsHTML() {
  const plats = META ? list(META.platforms) : [];
  return `<button class="chip ${LS.plats.size ? '' : 'on'}" data-p="">Все платформы <i>${META ? META.total : ''}</i></button>` +
    plats.map(p => `<button class="chip ${LS.plats.has(p.name) ? 'on' : ''}" data-p="${esc(p.name)}">${esc(p.name)} <i>${p.count}</i></button>`).join('');
}

function renderList() {
  app.innerHTML = `<section class="page">
    <div class="lhead">
      <div><div class="kicker">New Releases · SEE ALL</div><h1>Свежие релизы <em>Metacritic</em></h1>
      <p class="fresh"><span class="live-dot"></span><span id="freshTxt">${esc(freshLine())}</span></p></div>
    </div>
    <div class="toolbar">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Поиск по названию" value="${esc(LS.q)}" autocomplete="off"></label>
      <div class="select"><select id="sort" aria-label="Сортировка">
        <option value="meta">По Metascore</option><option value="user">По Userscore</option><option value="date">Сначала новые</option><option value="div">По расхождению критиков и игроков</option><option value="title">По названию</option>
      </select></div>
    </div>
    <div class="chips" id="plats">${chipsHTML()}</div>
    <div class="count-line" id="cnt"></div>
    <div class="grid" id="grid"></div>
    <div class="more" id="more"></div>
  </section>`;
  $('#sort').value = LS.sort;
  let deb;
  $('#q').addEventListener('input', e => { LS.q = e.target.value; clearTimeout(deb); deb = setTimeout(() => fetchGames(true), 250); });
  $('#sort').addEventListener('change', e => { LS.sort = e.target.value; fetchGames(true); });
  $('#plats').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const p = b.dataset.p;
    if (!p) LS.plats.clear(); else LS.plats.has(p) ? LS.plats.delete(p) : LS.plats.add(p);
    $$('#plats .chip').forEach(c => c.classList.toggle('on', c.dataset.p ? LS.plats.has(c.dataset.p) : !LS.plats.size));
    fetchGames(true);
  });
  $('#more').addEventListener('click', e => { if (e.target.closest('button')) fetchGames(false); });
  $('#grid').addEventListener('click', e => { if (e.target.closest('[data-retry]')) fetchGames(true); });
  loadMeta().then(() => {
    if (!$('#plats')) return;
    $('#freshTxt').textContent = freshLine();
    $('#plats').innerHTML = chipsHTML();
  });
  fetchGames(true);
}

async function fetchGames(reset) {
  const id = ++LS.req;
  const p = new URLSearchParams();
  if (LS.q.trim()) p.set('q', LS.q.trim());
  LS.plats.forEach(x => p.append('platform', x));
  p.set('sort', LS.sort); p.set('limit', PAGE); p.set('offset', reset ? 0 : LS.items.length);
  LS.loading = true; LS.error = null;
  if (reset) { LS.items = []; LS.total = 0; $('#grid').innerHTML = '<div class="loading" style="grid-column:1/-1">Загружаю игры…</div>'; $('#cnt').textContent = ''; }
  drawMore();
  try {
    const d = await api('/api/games?' + p);
    if (id !== LS.req || !$('#grid')) return;
    LS.items = reset ? list(d.items) : LS.items.concat(list(d.items));
    LS.total = d.total || 0;
    LS.loading = false;
    drawGrid(reset ? 0 : LS.items.length - list(d.items).length);
  } catch (e) {
    if (id !== LS.req || !$('#grid')) return;
    LS.loading = false; LS.error = e;
    if (reset) $('#grid').innerHTML = `<div style="grid-column:1/-1">${errBox('Не удалось загрузить список игр. Проверьте соединение и попробуйте ещё раз.')}</div>`;
    else toast('Не удалось загрузить следующую страницу');
    drawMore();
  }
}

function drawMore() {
  const el = $('#more'); if (!el) return;
  const rest = LS.total - LS.items.length;
  el.innerHTML = LS.items.length && rest > 0
    ? `<button class="btn ghost" ${LS.loading ? 'disabled' : ''}>${LS.loading ? 'Загрузка…' : `Показать ещё ${Math.min(rest, PAGE)}`}</button>` : '';
}

function gameCard(g, i) {
  const od = overallDelta(g);
  const plats = list(g.platforms);
  const rated = plats.filter(p => p.metascore != null || p.userscore != null);
  const unrated = plats.length - rated.length;
  const ref = META && META.collectedAt ? new Date(META.collectedAt) : new Date();
  const fresh = g.releaseDate && (ref - new Date(g.releaseDate)) / 864e5 <= 5;
  let tl = g.tagline || '';
  if (tl.length >= 110 && !/[.!?…]$/.test(tl)) tl = tl.replace(/\s+\S*$/, '') + '…';
  return `<a class="gcard" href="#/game/${esc(encodeURIComponent(g.slug))}" style="--i:${i % PAGE};--c3:${look(g.slug).pal[2]}">
    <div style="position:relative">${cover(g)}
      <div class="scorebox">${msBadge(g.metascore)}${usBadge(g.userscore)}</div>
      ${fresh ? '<span class="newtag">new</span>' : ''}
    </div>
    <div class="gbody">
      <div class="meta">${list(g.developer).length ? `<span>${esc(list(g.developer).join(', '))}</span>` : ''}${list(g.genres)[0] ? `<span>${esc(g.genres[0])}</span>` : ''}<span>${fmtDate(g.releaseDate)}</span></div>
      ${tl ? `<p class="tagline">${esc(tl)}</p>` : ''}
      ${od != null && Math.abs(od) >= 1 ? `<span class="flag">${od < 0 ? 'Игроки ниже критиков' : 'Игроки выше критиков'} на ${Math.abs(od).toFixed(1)}</span>` : ''}
      <div class="plats">${rated.map(p => `<span class="pchip" title="${esc(p.name)}: Metascore ${p.metascore ?? 'нет оценки'}, Userscore ${p.userscore ?? 'нет оценки'}">${esc(PLAT_SHORT[p.name] || p.name)}<span class="sep"></span><b class="sc-txt ${cls(p.metascore,100)}">${p.metascore ?? '—'}</b><b class="sc-txt ${cls(p.userscore,10)}">${num(p.userscore) != null ? num(p.userscore).toFixed(1) : '—'}</b></span>`).join('')}${unrated ? `<span class="pchip" title="${esc(plats.filter(p => p.metascore == null && p.userscore == null).map(p => p.name).join(', '))}">+${unrated} без оценок</span>` : ''}</div>
    </div></a>`;
}

function drawGrid(from) {
  const filtered = LS.q.trim() || LS.plats.size;
  $('#cnt').textContent = `Показано ${LS.items.length} из ${LS.total}` + (filtered && META ? ` · всего в базе ${META.total}` : '') + (LS.sort === 'user' || LS.sort === 'div' ? ' · игры без оценки в конце списка' : '');
  const grid = $('#grid');
  if (!LS.items.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${filtered ? 'Ничего не нашлось. Попробуйте другое название или снимите фильтр платформ.' : 'В базе пока нет игр: первый обход ещё идёт.'}</div>`;
  } else if (!from) {
    grid.innerHTML = LS.items.map(gameCard).join('');
  } else {
    grid.insertAdjacentHTML('beforeend', LS.items.slice(from).map((g, k) => gameCard(g, k)).join(''));
  }
  drawMore();
}

/* ===================== DETAIL ===================== */
let detailReq = 0;
async function renderDetail(slug) {
  const id = ++detailReq;
  app.innerHTML = `<section class="page"><a class="back" href="#/">← Все игры</a><div class="loading">Загружаю карточку игры…</div></section>`;
  let g;
  try { g = await api('/api/games/' + encodeURIComponent(slug)); }
  catch (e) {
    if (id !== detailReq) return;
    app.innerHTML = `<section class="page"><a class="back" href="#/">← Все игры</a>${e.status === 404
      ? '<div class="empty">Игра не найдена. <a href="#/" style="color:var(--acid)">К списку</a></div>'
      : errBox('Не удалось загрузить карточку игры. Попробуйте ещё раз.')}</section>`;
    const rb = $('[data-retry]'); if (rb) rb.addEventListener('click', () => renderDetail(slug));
    return;
  }
  if (id !== detailReq) return;
  drawDetail(g);
}

function summaryCol(g, side) {
  const s = g.summary ? g.summary[side === 'c' ? 'critics' : 'players'] : null;
  const analyzed = g.analyzed || {};
  const total = side === 'c' ? g.criticTotal : g.userTotal;
  const used = (side === 'c' ? analyzed.critic : analyzed.user) || 0;
  const title = side === 'c' ? 'Критики' : 'Игроки';
  const base = total ?? used;
  const note = `<span class="analyzed">проанализировано ${used} из ${base} ${side === 'c' ? plural(base, 'рецензии', 'рецензий', 'рецензий') : plural(base, 'отзыва', 'отзывов', 'отзывов')}</span>`;
  if (!s) {
    const few = side === 'p' && Math.max(total || 0, used) < 2;
    const msg = few
      ? 'Отзывов игроков пока слишком мало, Userscore не рассчитан. Резюме появится, когда при очередном обходе наберётся хотя бы несколько отзывов.'
      : 'Резюме появится после обработки отзывов.';
    return `<div class="sumcol ${side}"><header><h3>${title}</h3>${note}</header><div class="nodata">${msg}</div></div>`;
  }
  const li = it => `<li>${esc(it.text)}${it.quote ? `<q>${esc(it.quote)}</q>` : ''}${it.src ? `<span class="qsrc">${esc(it.src)}</span>` : ''}</li>`;
  const likes = list(s.likes), dislikes = list(s.dislikes);
  return `<div class="sumcol ${side}"><header><h3>${title}</h3>${note}</header>
    ${s.verdict ? `<p class="verdict">${esc(s.verdict)}</p>` : ''}
    ${likes.length ? `<div class="pc-h">Нравится</div><ul class="pc plus">${likes.map(li).join('')}</ul>` : ''}
    ${dislikes.length ? `<div class="pc-h">Не нравится</div><ul class="pc minus">${dislikes.map(li).join('')}</ul>` : ''}
  </div>`;
}

function lpSection(g, lp) {
  const moments = list(lp.moments).filter(m => m && m.t != null);
  const dur = num(lp.durationSec) || (moments.length ? Math.max(...moments.map(m => m.t)) * 1.08 : 0);
  const at = t => `${lp.url}&t=${Math.round(t)}s`;
  const thumb = lp.videoId ? `https://i.ytimg.com/vi/${encodeURIComponent(lp.videoId)}/hqdefault.jpg` : null;
  const extra = [lp.channel && esc(lp.channel), num(lp.views) != null && `${fmtInt(lp.views)} ${plural(num(lp.views), 'просмотр', 'просмотра', 'просмотров')}`].filter(Boolean).join(' · ');
  return `<section class="sec" id="s-lp">
      <div class="sec-h"><h2>Самый популярный летсплей</h2><span class="note">${dur ? fmtSec(dur) + ' · ' : ''}${moments.length} ${plural(moments.length, 'ключевой момент', 'ключевых момента', 'ключевых моментов')}</span></div>
      <div class="lp">
        <div>
          <div class="lpv">
            <a href="${esc(lp.url)}" target="_blank" rel="noopener" title="Открыть на YouTube">${cover({ slug: g.slug, title: g.title }, '', false, thumb)}<span class="lptitle">${esc(lp.title)}</span><span class="play-ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span><span class="lpnow" id="lpnow">0:00${dur ? ' / ' + fmtSec(dur) : ''}</span></a>
            <div class="tl-bar"><div class="tl-track"><div class="tl-prog" id="tlprog" style="width:0"></div>${dur ? moments.map((m, i) => `<a class="tl-mk" data-i="${i}" href="${esc(at(m.t))}" target="_blank" rel="noopener" style="left:${Math.min(100, m.t / dur * 100).toFixed(2)}%" title="${fmtSec(m.t)} · ${esc(m.text)}"></a>`).join('') : ''}</div></div>
          </div>
          <div class="lp-link" id="lplink"><a href="${esc(lp.url)}" target="_blank" rel="noopener">${esc(lp.url.replace(/^https?:\/\/(www\.)?/, ''))}</a>${extra ? ' · ' + extra : ''}</div>
        </div>
        <div>
          ${lp.summary ? `<p class="lp-sum">${esc(lp.summary)}</p>` : '<p class="lp-sum muted">Пересказ ролика появится после обработки расшифровки.</p>'}
          ${moments.length ? `<ol class="moments" id="moments">${moments.map((m, i) => `<li><a data-i="${i}" href="${esc(at(m.t))}" target="_blank" rel="noopener"><time>${fmtSec(m.t)}</time><span>${esc(m.text)}</span></a></li>`).join('')}</ol>` : ''}
        </div>
      </div>
    </section>`;
}

          </div>

            ${plats.map(p => `<tr><td>${esc(p.name)}</td><td>${scTxt(p.metascore, 100)}${p.metascore != null ? `<small>${esc(p.criticReviews ?? '')}</small>` : ''}</td><td>${scTxt(p.userscore, 10)}${p.userscore != null ? `<small>${esc(p.userReviews ?? '')}</small>` : ''}</td></tr>`).join('')}
          </tbody></table></div>` : ''}
        </div>
      </div>
    </div>

    <nav class="subnav" id="subnav">
      <button data-s="s-about">Об игре</button><button data-s="s-sum">Резюме отзывов</button>${lp ? '<button data-s="s-lp">Летсплей</button>' : ''}<button data-s="s-sim">Похожие</button>
    </nav>

    <section class="sec" id="s-about">
      <div class="two">
        <div><div class="sec-h"><h2>Об игре</h2></div><p class="desc">${g.description ? esc(String(g.description).replace(/\r\n?/g, '\n').trim()) : '<span class="muted">Описания на Metacritic пока нет.</span>'}</p></div>
        <div><div class="sec-h"><h2>Видео</h2>${v && v.duration ? `<span class="note">${fmtSec(v.duration)} · трейлер с Metacritic</span>` : v ? '<span class="note">трейлер с Metacritic</span>' : ''}</div>
          <div class="video" id="video">${cover(g, '', false)}${v && v.embedUrl
            ? `<button class="play" id="playBtn"><span class="play-ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span><span class="vt">${esc(v.title || 'Трейлер')}</span><span class="vd">плеер загрузится по клику</span></button>`

        : '<div class="nodata">Похожие игры появятся, когда в базе наберётся больше игр и пройдёт расчёт эмбеддингов.</div>'}
    </section>
  </section>`;

  $('#subnav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) document.getElementById(b.dataset.s).scrollIntoView({ behavior: 'smooth' }); });
  const pb = $('#playBtn');
  if (pb) pb.addEventListener('click', () => { $('#video').innerHTML = `<iframe src="${esc(v.embedUrl)}" allow="autoplay; fullscreen" allowfullscreen title="${esc(v.title || 'Трейлер')}"></iframe>`; });
  $('#s-sum').addEventListener('click', e => { const li = e.target.closest('.pc li'); if (li) li.classList.toggle('open'); });

    const moments = list(lp.moments).filter(m => m && m.t != null);
    const dur = num(lp.durationSec) || (moments.length ? Math.max(...moments.map(m => m.t)) * 1.08 : 0);

      const m = moments[i]; if (!m) return;
      if (dur) $('#tlprog').style.width = Math.min(100, m.t / dur * 100) + '%';
      $('#lpnow').textContent = `${fmtSec(m.t)}${dur ? ' / ' + fmtSec(dur) : ''}`;
      $$('#moments a').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
      $$('.tl-mk').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    };
    $('#s-lp').addEventListener('click', e => { const a = e.target.closest('[data-i]'); if (a) seek(+a.dataset.i); });
    $('#s-lp').addEventListener('mouseover', e => { const a = e.target.closest('[data-i]'); if (a) seek(+a.dataset.i); });
  }
}

  { k: 'parse', n: 'Разбор', d: 'нормализация, upsert по slug', cnt: 'parse', w: ['parse'] },
  { k: 'summary', n: 'Резюме', d: 'LLM, structured output с цитатами', cnt: 'summary', w: ['summary'] },
  { k: 'embed', n: 'Эмбеддинги', d: 'жанры, компании, платформы, TF-IDF описания', cnt: 'embed', w: ['similar'] },
  { k: 'similar', n: 'Похожие', d: 'kNN по векторам, объяснения', cnt: 'similar', w: ['similar'] },
];

  app.innerHTML = `<section class="page">

        <button class="btn" id="runBtn" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>Запустить сейчас</button></div>
    </div>
    <div class="pipe"><div class="pipe-top"><div class="batch" id="batch">Источник: <b>загрузка…</b></div><div class="batch" id="elapsed"></div></div>
      <div class="stages" id="stages">${STAGES.map((s, i) => `<div class="stage" data-i="${i}"><div class="stage-in"><div><div class="num">0${i + 1}</div><h3>${s.n}</h3><p>${s.d}</p></div><div class="cnt"><span>0</span><small>/—</small></div><div class="sbar"><i></i></div><div class="cur"></div></div></div>`).join('')}</div>
    </div>
    <div class="counters" id="counters"></div>
    <div class="mgrid">
      <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
        <div class="panel"><h2>Воркеры <small>offline, если нет heartbeat 30 с</small></h2><table class="tbl"><thead><tr><th>Воркер</th><th>Статус</th><th>Задача</th><th class="r">Готово</th></tr></thead><tbody id="workers"><tr><td colspan="4" class="dim">Загрузка…</td></tr></tbody></table></div>
        <div class="panel"><h2>Стоимость по играм <small id="llmNote"></small></h2><table class="tbl"><thead><tr><th>Игра</th><th class="r hide-m">Вход</th><th class="r hide-m">Выход</th><th class="r">Токены</th><th class="r">$</th></tr></thead><tbody id="costs"><tr><td colspan="5" class="dim">Загрузка…</td></tr></tbody></table></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
        <div class="panel"><h2>Лог <small>последние события</small></h2><div class="log" id="log"></div></div>
        <div class="panel"><h2>Состояние обхода</h2><dl class="crawl" id="crawl"></dl><div class="hist" id="hist"></div><div class="hist-l"><span>ранние запуски</span><span>последний</span></div></div>
      </div>
    </div></section>`;
  $('#runBtn').addEventListener('click', startRun);
  MON.dirty = true;
  if (MON.state) updMonitor();
  drawLog();
  connectSSE();
  clearInterval(MON.timer);
  MON.timer = setInterval(() => { if ($('#stages')) { drawCountdown(); drawElapsed(); } }, 1000);
}

function stopMonitor() {
  if (MON.es) { MON.es.close(); MON.es = null; }
  clearTimeout(MON.retry); clearInterval(MON.timer);
}

function connectSSE() {
  if (MON.es) MON.es.close();
  clearTimeout(MON.retry);
  const es = new EventSource('/api/monitor/stream' + (MON.lastId ? '?after=' + MON.lastId : ''));
  MON.es = es;
  es.addEventListener('open', () => setOnline(true));
  es.addEventListener('state', e => {
    try { MON.state = JSON.parse(e.data); } catch (_) { return; }
    const now = Date.parse(MON.state.now); if (!isNaN(now)) MON.skew = now - Date.now();
    setOnline(true);
    updMonitor();
  });
  es.addEventListener('log', e => {
    let rows; try { rows = JSON.parse(e.data); } catch (_) { return; }
    const fresh = list(rows).filter(r => r.id > MON.lastId);
    if (!fresh.length) return;
    MON.lastId = fresh[fresh.length - 1].id;
    MON.log = MON.log.concat(fresh).slice(-LOG_MAX);
    MON.dirty = true; drawLog();
  });
  es.addEventListener('error', () => {
    // переподключаемся сами, чтобы передать ?after=<последний id> и не получить лог заново
    es.close(); if (MON.es === es) MON.es = null;
    setOnline(false);
    if (route().name === 'monitor') MON.retry = setTimeout(connectSSE, 3000);
  });
}

function setOnline(on) {
  MON.online = on;
  const t = $('#sseTxt'), d = $('#sseDot'); if (!t) return;
  t.textContent = on ? 'Обновляется в реальном времени (SSE)' : 'Связь с сервером потеряна, переподключаюсь…';
  d.style.background = on ? '' : 'var(--warn)'; d.style.boxShadow = on ? '' : '0 0 10px var(--warn)';
}

const isActive = run => !!run && (run.status === 'queued' || run.status === 'running');

async function startRun() {
  const btn = $('#runBtn'); if (btn) btn.disabled = true;
  try {
    const r = await fetch('/api/runs', { method: 'POST', headers: { Accept: 'application/json' } });
    if (r.status === 202) toast('Запуск поставлен в очередь');
    else if (r.status === 409) toast('Запуск уже идёт: повторный старт заблокирован');
    else toast('Не удалось поставить запуск: HTTP ' + r.status);
  } catch (e) { toast('Не удалось связаться с сервером'); }
  if (btn && !isActive(MON.state && MON.state.run)) btn.disabled = false;
}

function drawCountdown() {
  const s = MON.state, el = $('#countdown'); if (!el) return;
  if (!s || !s.nextRunAt) { el.textContent = '--:--'; return; }
  let ms = Math.max(0, Date.parse(s.nextRunAt) - (Date.now() + MON.skew));
  const h = Math.floor(ms / 3600000); ms %= 3600000;
  el.textContent = (h ? h + ':' : '') + `${String(Math.floor(ms / 60000)).padStart(2, '0')}:${String(Math.floor(ms % 60000 / 1000)).padStart(2, '0')}`;
}
function drawElapsed() {
  const run = MON.state && MON.state.run, el = $('#elapsed'); if (!el) return;
  if (!run) { el.textContent = ''; return; }
  if (run.status === 'running' && run.started_at) el.textContent = `идёт ${fmtSec((Date.now() + MON.skew - Date.parse(run.started_at)) / 1000)}`;
  else if (run.status === 'queued') el.textContent = 'ждёт свободного воркера';
  else if (run.status === 'failed') el.textContent = 'последний запуск завершился ошибкой' + (run.error ? ': ' + run.error : '');
  else el.textContent = 'последний запуск завершён' + (run.finished_at ? ' в ' + fmtTime(run.finished_at) : '');
}

function updMonitor() {
  const s = MON.state; if (!s || !$('#stages')) return;
  const run = s.run, active = isActive(run);
  $('#navPulse').hidden = !active;
  const pill = $('#stpill');
  pill.classList.toggle('run', active);
  pill.lastElementChild.textContent = !run ? 'запусков ещё не было' : run.status === 'running' ? `run #${run.id} выполняется` : run.status === 'queued' ? `run #${run.id} в очереди` : 'ожидание';
  const btn = $('#runBtn');
  btn.disabled = active; btn.lastChild.textContent = active ? 'Идёт обработка' : 'Запустить сейчас';
  drawCountdown(); drawElapsed();
  const total = run ? num(run.games_total) || 0 : 0;
  $('#batch').innerHTML = run ? `Источник: <b>${esc(run.source || 'ожидание запуска')}</b>${total ? ` · ${total} ${plural(total, 'игра', 'игры', 'игр')}` : ''}` : 'Источник: <b>ожидание запуска</b>';

  const stages = s.stages || {};
  const workers = list(s.workers);
  const counts = STAGES.map(st => num(stages[st.cnt]) || 0);
  $$('#stages .stage').forEach((el, i) => {
    const st = STAGES[i];
    const w = workers.find(w => w.status === 'busy' && !w.stale && st.w.includes(w.stage));
    const n = counts[i];
    el.classList.toggle('active', !!w);
    el.classList.toggle('done', !!run && total > 0 && n >= total && !active);
    el.classList.toggle('flow', !!run && run.status === 'running' && i < STAGES.length - 1 && n > 0 && n > counts[i + 1]);
    el.querySelector('.cnt span').textContent = n;
    el.querySelector('.cnt small').textContent = '/' + (total || '—');
    el.querySelector('.sbar i').style.width = (total ? Math.min(100, n / total * 100) : 0) + '%';
    el.querySelector('.cur').textContent = w && w.job ? '▸ ' + w.job : '';
  });

  const c = s.counters || {};
  const C = [['Игр в базе', fmtInt(c.games)], ['Обработано сегодня', fmtInt(c.today)], ['Отзывов разобрано', fmtInt(c.reviews)], ['Ошибок сегодня', fmtInt(c.errors_today)], ['Токенов за run', fmtInt(c.tokensRun)], ['$ на игру', c.costPerGame == null ? '—' : '$' + num(c.costPerGame).toFixed(4), true]];
  $('#counters').innerHTML = C.map(([a, b, acid]) => `<div class="ctr"><span>${a}</span><b class="${acid ? 'acid' : ''}">${b}</b></div>`).join('');

  $('#workers').innerHTML = workers.length ? workers.map(w => {
    const st = w.stale ? 'offline' : w.status === 'busy' ? 'busy' : 'idle';
    return `<tr><td class="mono">${esc(w.name)}</td><td><span class="wst ${st}"><i></i>${st}</span></td><td class="job">${w.job && !w.stale ? esc(w.job) : '<span class="dim">—</span>'}</td><td class="r mono">${fmtInt(w.processed)}</td></tr>`;
  }).join('') : '<tr><td colspan="4" class="dim">Воркеры ещё не регистрировались</td></tr>';

  const llm = s.llm || {};
  $('#llmNote').innerHTML = llm.enabled ? `${esc(llm.model)} · $${esc(llm.priceIn)}/$${esc(llm.priceOut)} за 1M` : '<span class="llm-off">LLM не настроен: резюме пропускаются</span>';
  const costs = list(s.costs);
  const runCost = run ? num(run.cost_usd) || 0 : 0;
  $('#costs').innerHTML = costs.length ? costs.map(r => { const ti = num(r.tokens_in) || 0, to = num(r.tokens_out) || 0; return `<tr><td class="job" style="color:var(--text)">${esc(r.title || r.slug || '—')}</td><td class="r mono hide-m">${fmtInt(ti)}</td><td class="r mono hide-m">${fmtInt(to)}</td><td class="r mono">${fmtInt(ti + to)}</td><td class="r mono" style="color:var(--acid)">${(num(r.cost) || 0).toFixed(4)}</td></tr>`; }).join('')
    + `<tr><td><b>Итого за run</b></td><td class="hide-m"></td><td class="hide-m"></td><td class="r mono">${costs.length} ${plural(costs.length, 'игра', 'игры', 'игр')}</td><td class="r mono"><b>$${runCost.toFixed(3)}</b></td></tr>`
    : `<tr><td colspan="5" class="dim">${llm.enabled ? 'Появится после первой обработанной игры' : 'Без LLM расходов нет'}</td></tr>`;

  const cr = s.crawl || {};
  $('#crawl').innerHTML = `<dt>Дата обхода</dt><dd>${esc(cr.day || '—')} · сброс в 00:00</dd><dt>New Releases</dt><dd>${cr.newReleasesDone ? 'обработан ✓' : 'в очереди'}</dd><dt>Курсор SEE ALL</dt><dd>стр. ${esc(cr.seeAllPage ?? 1)} (sort=new)</dd><dt>Обработано сегодня</dt><dd>${fmtInt(cr.processedToday)} ${plural(num(cr.processedToday) || 0, 'игра', 'игры', 'игр')}</dd><dt>Уникальность</dt><dd>не повторяем игры, обработанные сегодня</dd>`;

  const hist = list(s.history).slice(-12);
  const max = Math.max(1, ...hist.map(h => num(h.games_total) || 0));
  $('#hist').innerHTML = hist.length ? hist.map(h => {
    const n = num(h.games_total) || 0, err = num(h.errors) || 0;
    const k = h.status === 'running' ? 'cur' : h.status === 'failed' ? 'fail' : err > 0 ? 'err' : '';
    return `<div class="${k}" style="height:${Math.max(5, n / max * 100)}%" title="#${h.id} · ${esc(h.trigger === 'manual' ? 'ручной' : 'по расписанию')} · ${n} ${plural(n, 'игра', 'игры', 'игр')}${err ? `, ошибок: ${err}` : ''}${h.status === 'failed' ? ', упал' : ''}"></div>`;
  }).join('') : '';
}

function drawLog() {
  const el = $('#log'); if (!el || !MON.dirty) return;
  const stick = el.scrollHeight - el.scrollTop - el.clientHeight < 40 || !el.childElementCount;
  el.innerHTML = MON.log.length ? MON.log.map(l => `<div><span class="t">${fmtTime(l.ts)}</span> <span class="w">${esc(String(l.worker || '').padEnd(11))}</span> <span class="${LVL[l.level] || 'inf'}">${esc(l.message)}</span></div>`).join('') : '<div class="t">Событий пока нет</div>';
  if (stick) el.scrollTop = el.scrollHeight;
  MON.dirty = false;
}

/* ===================== ROUTER ===================== */
function route() { const h = location.hash.replace(/^#\/?/, ''); if (h.startsWith('game/')) { let slug = h.slice(5); try { slug = decodeURIComponent(slug); } catch (_) {} return { name: 'game', slug }; } return { name: h === 'monitor' ? 'monitor' : 'list' }; }
let lastRoute = '';
function render() {
  const r = route();
  const key = r.name + (r.slug || '');
  if (key === lastRoute) return; lastRoute = key;
  if (r.name !== 'monitor') { stopMonitor(); $('#navPulse').hidden = true; }
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === (r.name === 'game' ? 'list' : r.name)));
  if (r.name === 'game') renderDetail(r.slug); else if (r.name === 'monitor') renderMonitor(); else renderList();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', render);
render();
if (route().name !== 'list') loadMeta();
</script>
</body>
</html>
