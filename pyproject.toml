[project]
name = "scorecast"
version = "0.1.0"
description = "Hourly Metacritic games crawler with review summaries, similar games and live monitoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10,<4",
    "openai>=1.54",
    "yt-dlp>=2025.5.22",
    "youtube-transcript-api>=1.2",
    "pysocks>=1.7",
    "numpy>=2.1",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
